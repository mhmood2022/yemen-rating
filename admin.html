<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | يمن ريتغ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
:root{--navy-900:#0a1120;--navy-800:#0f172a;--navy-700:#152033;--navy-600:#1e293b;--gold-500:#d4af37;--gold-400:#fbbf24;--danger:#ef4444;--success:#10b981;--text-main:#f8fafc;--text-muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--navy-900);color:var(--text-main);min-height:100vh}
.header{background:var(--navy-800);border-bottom:1px solid var(--navy-600);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:1.2rem;color:var(--gold-400);display:flex;align-items:center;gap:8px}
.header-actions{display:flex;gap:10px;align-items:center}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:.85rem;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--gold-400),var(--gold-500));color:var(--navy-900)}
.btn-danger{background:var(--danger);color:white}
.container{max-width:1400px;margin:0 auto;padding:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px}
.stat-card{background:var(--navy-800);border:1px solid var(--navy-600);border-radius:12px;padding:20px;text-align:center}
.stat-card .number{font-size:2rem;font-weight:800;color:var(--gold-400);margin:10px 0}
.stat-card .label{color:var(--text-muted);font-size:.85rem}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;border-bottom:1px solid var(--navy-600);padding-bottom:10px}
.tab-btn{padding:10px 18px;border-radius:8px;border:1px solid var(--navy-600);background:var(--navy-800);color:var(--text-muted);cursor:pointer;font-weight:600;font-size:.85rem;font-family:inherit}
.tab-btn.active{background:var(--gold-500);color:var(--navy-900);border-color:var(--gold-500)}
.section{display:none}
.section.active{display:block}
.card{background:var(--navy-800);border:1px solid var(--navy-600);border-radius:12px;padding:20px;margin-bottom:15px}
.card h3{color:var(--gold-400);margin-bottom:15px;font-size:1rem}
.empty{text-align:center;padding:40px;color:var(--text-muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--success);color:white;padding:12px 24px;border-radius:8px;font-weight:600;z-index:1000;animation:slideUp .3s}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>

<div class="header">
    <h1><i class="fas fa-chart-line"></i> لوحة التحكم</h1>
    <div class="header-actions">
        <span id="adminName" style="color:var(--text-muted);font-size:.85rem"></span>
        <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>
</div>

<div class="container">
    <!-- الإحصائيات -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">المنشآت</div>
            <div class="number" id="statEnts">0</div>
        </div>
        <div class="stat-card">
            <div class="label">الوظائف</div>
            <div class="number" id="statJobs">0</div>
        </div>
        <div class="stat-card">
            <div class="label">طلبات التوظيف</div>
            <div class="number" id="statApps">0</div>
        </div>
        <div class="stat-card">
            <div class="label">التقييمات</div>
            <div class="number" id="statRevs">0</div>
        </div>
        <div class="stat-card">
            <div class="label">الإعلانات</div>
            <div class="number" id="statAds">0</div>
        </div>
    </div>

    <!-- التبويبات -->
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('ents',this)"><i class="fas fa-building"></i> المنشآت</button>
        <button class="tab-btn" onclick="showTab('jobs',this)"><i class="fas fa-briefcase"></i> الوظائف</button>
        <button class="tab-btn" onclick="showTab('apps',this)"><i class="fas fa-file-alt"></i> الطلبات</button>
        <button class="tab-btn" onclick="showTab('revs',this)"><i class="fas fa-star"></i> التقييمات</button>
        <button class="tab-btn" onclick="showTab('ads',this)"><i class="fas fa-ad"></i> الإعلانات</button>
    </div>

    <!-- قسم المنشآت -->
    <div id="sec-ents" class="section active">
        <div class="card">
            <h3><i class="fas fa-plus-circle"></i> إضافة منشأة جديدة</h3>
            <form id="entForm" onsubmit="saveEntity(event)">
                <input type="text" id="eName" placeholder="اسم المنشأة" required style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--navy-600);background:var(--navy-900);color:var(--text-main)">
                <select id="eType" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--navy-600);background:var(--navy-900);color:var(--text-main)">
                    <option value="company">شركة</option>
                    <option value="bank">بنك</option>
                    <option value="shop">محل</option>
                    <option value="restaurant">مطعم</option>
                </select>
                <input type="text" id="eCity" placeholder="المدينة" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--navy-600);background:var(--navy-900);color:var(--text-main)">
                <input type="tel" id="ePhone" placeholder="الهاتف" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--navy-600);background:var(--navy-900);color:var(--text-main)">
                <textarea id="eDesc" placeholder="الوصف" rows="3" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--navy-600);background:var(--navy-900);color:var(--text-main)"></textarea>
                <select id="eStatus" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--navy-600);background:var(--navy-900);color:var(--text-main)">
                    <option value="PENDING">معلق</option>
                    <option value="PUBLISHED">منشور</option>
                </select>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px"><i class="fas fa-save"></i> حفظ المنشأة</button>
            </form>
        </div>
        <div class="card">
            <h3><i class="fas fa-list"></i> قائمة المنشآت</h3>
            <div id="listEnts" class="empty">لا توجد منشآت بعد</div>
        </div>
    </div>

    <!-- قسم الوظائف -->
    <div id="sec-jobs" class="section">
        <div class="card">
            <h3><i class="fas fa-list"></i> قائمة الوظائف</h3>
            <div id="listJobs" class="empty">لا توجد وظائف بعد</div>
        </div>
    </div>

    <!-- قسم الطلبات -->
    <div id="sec-apps" class="section">
        <div class="card">
            <h3><i class="fas fa-list"></i> طلبات التوظيف</h3>
            <div id="listApps" class="empty">لا توجد طلبات بعد</div>
        </div>
    </div>

    <!-- قسم التقييمات -->
    <div id="sec-revs" class="section">
        <div class="card">
            <h3><i class="fas fa-list"></i> التقييمات</h3>
            <div id="listRevs" class="empty">لا توجد تقييمات بعد</div>
        </div>
    </div>

    <!-- قسم الإعلانات -->
    <div id="sec-ads" class="section">
        <div class="card">
            <h3><i class="fas fa-list"></i> الإعلانات</h3>
            <div id="listAds" class="empty">لا توجد إعلانات بعد</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/sb-sync.js"></script>
<script>
// ═══ Admin Panel Logic ═══
const sb = window.supabase.createClient(
    'https://wkdqeghotlipciqiytuj.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrZHFlZ2hvdGxpcGNpcWl5dHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MDM4NzEsImV4cCI6MjEwMjQ3OTg3MX0.ahqq5okKMXMxuI-8sArjxcVIpPDRmX20mhscs8BaCTE'
);

// التحقق من الدخول
(async function checkAuth(){
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { location.href = 'admin-login.html'; return; }
    
    const { data: profile } = await sb.from('profiles').select('role, full_name').eq('id', user.id).single();
    if (!profile || (profile.role !== 'admin' && profile.role !== 'super_admin')) {
        alert('⛔ ليس لديك صلاحية');
        await sb.auth.signOut();
        location.href = 'index.html';
        return;
    }
    
    document.getElementById('adminName').textContent = profile.full_name || user.email;
    loadData();
})();

// تحميل البيانات من Supabase
async function loadData(){
    try {
        const [ents, jobs, apps, revs, ads] = await Promise.all([
            sb.from('entities').select('*').order('created_at', { ascending: false }),
            sb.from('jobs').select('*').order('created_at', { ascending: false }),
            sb.from('applications').select('*').order('created_at', { ascending: false }),
            sb.from('reviews').select('*').order('created_at', { ascending: false }),
            sb.from('advertisements').select('*').order('created_at', { ascending: false })
        ]);
        
        // تحديث الإحصائيات
        document.getElementById('statEnts').textContent = ents.data?.length || 0;
        document.getElementById('statJobs').textContent = jobs.data?.length || 0;
        document.getElementById('statApps').textContent = apps.data?.length || 0;
        document.getElementById('statRevs').textContent = revs.data?.length || 0;
        document.getElementById('statAds').textContent = ads.data?.length || 0;
        
        // عرض القوائم
        renderList('listEnts', ents.data, 'name', 'type', 'city', 'status');
        renderList('listJobs', jobs.data, 'title', 'type', 'city', 'status');
        renderList('listApps', apps.data, 'applicant_name', 'experience', null, 'status');
        renderList('listRevs', revs.data, 'user_name', 'stars', null, 'status');
        renderList('listAds', ads.data, 'title', null, null, 'status');
    } catch (err) {
        console.error('Load failed:', err);
        showToast('❌ فشل تحميل البيانات');
    }
}

function renderList(containerId, data, field1, field2, field3, statusField){
    const container = document.getElementById(containerId);
    if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty">لا توجد بيانات</div>';
        return;
    }
    
    container.innerHTML = data.map(item => `
        <div style="padding:12px;border-bottom:1px solid var(--navy-600);display:flex;justify-content:space-between;align-items:center">
            <div>
                <strong>${item[field1] || '-'}</strong>
                ${field2 ? `<br><small style="color:var(--text-muted)">${item[field2] || ''} ${field3 ? '• ' + (item[field3] || '') : ''}</small>` : ''}
            </div>
            <div>
                <span style="padding:4px 8px;border-radius:4px;font-size:.75rem;background:${item[statusField]==='PUBLISHED'||item[statusField]==='ACTIVE'?'var(--success)':'var(--gold-500)'};color:var(--navy-900)">
                    ${item[statusField] || '-'}
                </span>
            </div>
        </div>
    `).join('');
}

// حفظ منشأة
async function saveEntity(e){
    e.preventDefault();
    const data = {
        type: document.getElementById('eType').value,
        name: document.getElementById('eName').value.trim(),
        city: document.getElementById('eCity').value.trim(),
        phone: document.getElementById('ePhone').value.trim(),
        description: document.getElementById('eDesc').value.trim(),
        status: document.getElementById('eStatus').value,
        owner_id: (await sb.auth.getUser()).data.user?.id || null
    };
    
    try {
        const { error } = await sb.from('entities').insert(data);
        if (error) throw error;
        showToast('✅ تم حفظ المنشأة');
        document.getElementById('entForm').reset();
        loadData();
    } catch (err) {
        console.error('Save failed:', err);
        showToast('❌ فشل الحفظ: ' + err.message);
    }
}

// تبديل التبويبات
function showTab(tab, btn){
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('sec-' + tab).classList.add('active');
}

// تسجيل الخروج
async function logout(){
    await sb.auth.signOut();
    localStorage.removeItem('yr_session');
    location.href = 'index.html';
}

// إشعار
function showToast(msg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
