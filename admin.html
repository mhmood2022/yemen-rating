<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | يمن ريتغ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a1120;
            --card-bg: #0f172a;
            --header-bg: #152033;
            --border-color: #1e293b;
            --gold-gradient: linear-gradient(135deg, #fbbf24, #d4af37);
            --gold-text: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; }
        .hidden { display: none !important; }
        
        /* شاشة الدخول */
        .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: var(--card-bg); border: 1px solid var(--gold-text); border-radius: 12px; padding: 35px; width: 100%; max-width: 400px; text-align: center; }
        .login-logo { width: 60px; height: 60px; background: var(--gold-gradient); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: #0a1120; margin: 0 auto 15px; }

        /* الهيكل العام */
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--bg-dark); border-left: 1px solid var(--border-color); height: 100vh; position: fixed; right: 0; top: 0; z-index: 100; }
        .brand { padding: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); font-weight: 800; color: var(--gold-text); }
        .nav-menu { padding: 15px 10px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-muted); text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; font-weight: 600; }
        .nav-item:hover, .nav-item.active { background: var(--header-bg); color: var(--gold-text); }

        .main-content { flex: 1; margin-right: 260px; padding: 25px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: var(--card-bg); padding: 15px 20px; border-radius: 10px; border: 1px solid var(--border-color); }
        
        /* البطاقات والجداول */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); border-radius: 8px; padding: 20px; border-right: 4px solid var(--gold-text); border: 1px solid var(--border-color); }
        .stat-card .num { font-size: 1.8rem; font-weight: 800; color: var(--gold-text); }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .table-container { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: var(--header-bg); color: var(--gold-text); padding: 12px 15px; font-size: 0.9rem; }
        td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }

        /* الأزرار المدخلات */
        .btn-gold { background: var(--gold-gradient); color: #0a1120; font-weight: 700; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .btn-edit { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        .btn-verify { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .form-control { width: 100%; padding: 10px; background: var(--header-bg); border: 1px solid var(--border-color); border-radius: 6px; color: #fff; margin-top: 5px; }

        /* النوافذ المنبثقة Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 15px; }
        .modal-card { background: var(--card-bg); border: 1px solid var(--gold-text); border-radius: 12px; padding: 25px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-right: 0; }
            .admin-layout { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- زر رجوع سريع للموقع -->
    <a href="index.html" class="btn-gold" style="position:fixed; bottom:15px; left:15px; z-index:999;">
        <i class="fas fa-arrow-right"></i> للموقع
    </a>

    <!-- 1. شاشة الدخول -->
    <div class="login-wrapper" id="loginSec">
        <div class="login-card">
            <div class="login-logo"><i class="fas fa-user-shield"></i></div>
            <h2 style="color:var(--gold-text); margin-bottom:10px;">إدارة يمن ريتغ</h2>
            <form id="loginForm">
                <input type="password" id="passInput" class="form-control" placeholder="كلمة المرور (123456)" required>
                <button type="submit" class="btn-gold" style="width:100%; margin-top:15px; justify-content:center;">دخول</button>
            </form>
        </div>
    </div>

    <!-- 2. لوحة التحكم -->
    <div class="admin-layout hidden" id="appSec">
        <aside class="sidebar">
            <div class="brand"><i class="fas fa-star"></i> YEMEN RATING</div>
            <div class="nav-menu">
                <div class="nav-item active" onclick="switchTab('entities', this)"><i class="fas fa-building"></i> المنشآت والشركات</div>
                <div class="nav-item" onclick="switchTab('categories', this)"><i class="fas fa-list"></i> التصنيفات</div>
                <div class="nav-item" onclick="logout()" style="color:#f87171; margin-top:20px;"><i class="fas fa-power-off"></i> خروج</div>
            </div>
        </aside>

        <main class="main-content">
            <div class="header-bar">
                <h3 id="tabTitle">إدارة الشركات والمنشآت</h3>
                <span style="color:var(--gold-text); font-weight:700;">المدير العام</span>
            </div>

            <!-- إحصائيات -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="num" id="countEntities">0</div>
                    <div>إجمالي المنشآت</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="countVerified">0</div>
                    <div>منشآت موثقة</div>
                </div>
            </div>

            <!-- تبويب المنشآت -->
            <div id="tab-entities">
                <div class="panel-header">
                    <input type="text" id="searchEntity" class="form-control" style="max-width:250px;" placeholder="بحث بالاسم..." oninput="renderEntities()">
                    <button class="btn-gold" onclick="openEntityModal()"><i class="fas fa-plus"></i> إضافة منشأة جديدة</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>اسم المنشأة</th>
                                <th>القطاع/التصنيف</th>
                                <th>المدينة</th>
                                <th>التوثيق</th>
                                <th>التحكم</th>
                            </tr>
                        </thead>
                        <tbody id="entitiesTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- تبويب التصنيفات -->
            <div id="tab-categories" class="hidden">
                <div class="panel-header">
                    <h3>قائمة التصنيفات</h3>
                    <button class="btn-gold" onclick="openCatModal()"><i class="fas fa-plus"></i> إضافة تصنيف</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>اسم التصنيف</th>
                                <th>الأيقونة</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="categoriesTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Form (منبثق الإضافة والتعديل) -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-head">
                <h3 id="modalTitle" style="color:var(--gold-text);">إضافة منشأة</h3>
                <button onclick="closeModal()" style="background:none; border:none; color:#fff; cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // قواعد البيانات المحلية والتلقائية
        let DB = {
            entities: JSON.parse(localStorage.getItem('yr_entities')) || [
                { id: 1, name: 'بنك اليمن والكويت', category: 'بنوك ومصارف', city: 'صنعاء', isVerified: true, phone: '01200300' },
                { id: 2, name: 'شركة يمن موبايل', category: 'اتصالات', city: 'صنعاء', isVerified: true, phone: '01400400' }
            ],
            categories: JSON.parse(localStorage.getItem('yr_categories')) || [
                { id: 1, name: 'بنوك ومصارف', icon: 'fa-landmark' },
                { id: 2, name: 'اتصالات', icon: 'fa-phone' },
                { id: 3, name: 'شحن ولوجستيات', icon: 'fa-truck' }
            ]
        };

        function saveDB() {
            localStorage.setItem('yr_entities', JSON.stringify(DB.entities));
            localStorage.setItem('yr_categories', JSON.stringify(DB.categories));
            updateStats();
        }

        // تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('passInput').value;
            if (pass === '123456' || pass === 'admin') {
                sessionStorage.setItem('yr_admin', '1');
                initApp();
            } else {
                alert('كلمة المرور خاطئة! (الافتراضية: 123456)');
            }
        });

        function initApp() {
            if (sessionStorage.getItem('yr_admin') === '1') {
                document.getElementById('loginSec').classList.add('hidden');
                document.getElementById('appSec').classList.remove('hidden');
                updateStats();
                renderEntities();
                renderCategories();
            }
        }

        function logout() {
            sessionStorage.removeItem('yr_admin');
            location.reload();
        }

        function updateStats() {
            document.getElementById('countEntities').innerText = DB.entities.length;
            document.getElementById('countVerified').innerText = DB.entities.filter(e => e.isVerified).length;
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            
            document.getElementById('tab-entities').classList.add('hidden');
            document.getElementById('tab-categories').classList.add('hidden');
            
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('tabTitle').innerText = tab === 'entities' ? 'إدارة الشركات والمنشآت' : 'إدارة التصنيفات';
        }

        // --- عرض وإدارة الشركات ---
        function renderEntities() {
            const query = document.getElementById('searchEntity').value.toLowerCase();
            const tbody = document.getElementById('entitiesTable');
            const filtered = DB.entities.filter(e => e.name.toLowerCase().includes(query));

            if(filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد بيانات</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(item => `
                <tr>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.category || '-'}</td>
                    <td>${item.city || 'صنعاء'}</td>
                    <td>${item.isVerified ? '<span style="color:#4ade80;">✔ موثق</span>' : '<span style="color:#94a3b8;">غير موثق</span>'}</td>
                    <td>
                        <button class="btn-gold btn-sm btn-verify" onclick="toggleVerify(${item.id})"><i class="fas fa-check-circle"></i></button>
                        <button class="btn-gold btn-sm btn-edit" onclick="openEntityModal(${item.id})"><i class="fas fa-edit"></i></button>
                        <button class="btn-gold btn-sm btn-danger" onclick="deleteEntity(${item.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function toggleVerify(id) {
            const ent = DB.entities.find(e => e.id === id);
            if(ent) {
                ent.isVerified = !ent.isVerified;
                saveDB();
                renderEntities();
            }
        }

        function deleteEntity(id) {
            if(confirm('هل أنت تأكد من الحذف؟')) {
                DB.entities = DB.entities.filter(e => e.id !== id);
                saveDB();
                renderEntities();
            }
        }

        function openEntityModal(id = null) {
            const ent = id ? DB.entities.find(e => e.id === id) : null;
            document.getElementById('modalTitle').innerText = ent ? 'تعديل منشأة' : 'إضافة منشأة جديدة';
            
            const catOptions = DB.categories.map(c => `<option value="${c.name}" ${ent && ent.category === c.name ? 'selected' : ''}>${c.name}</option>`).join('');

            document.getElementById('modalBody').innerHTML = `
                <form onsubmit="saveEntity(event, ${id})">
                    <div style="margin-bottom:12px;">
                        <label>اسم المنشأة *</label>
                        <input type="text" id="entName" class="form-control" value="${ent ? ent.name : ''}" required>
                    </div>
                    <div style="margin-bottom:12px;">
                        <label>التصنيف</label>
                        <select id="entCat" class="form-control">${catOptions}</select>
                    </div>
                    <div style="margin-bottom:12px;">
                        <label>المدينة</label>
                        <input type="text" id="entCity" class="form-control" value="${ent ? ent.city : 'صنعاء'}">
                    </div>
                    <div style="margin-bottom:12px;">
                        <label>رقم الهاتف</label>
                        <input type="text" id="entPhone" class="form-control" value="${ent ? ent.phone || '' : ''}">
                    </div>
                    <button type="submit" class="btn-gold" style="width:100%; justify-content:center; margin-top:10px;">حفظ البيانات</button>
                </form>
            `;
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function saveEntity(e, id) {
            e.preventDefault();
            const name = document.getElementById('entName').value;
            const category = document.getElementById('entCat').value;
            const city = document.getElementById('entCity').value;
            const phone = document.getElementById('entPhone').value;

            if(id) {
                const ent = DB.entities.find(x => x.id === id);
                ent.name = name; ent.category = category; ent.city = city; ent.phone = phone;
            } else {
                DB.entities.push({ id: Date.now(), name, category, city, phone, isVerified: false });
            }
            saveDB();
            closeModal();
            renderEntities();
        }

        // --- عرض وإدارة التصنيفات ---
        function renderCategories() {
            const tbody = document.getElementById('categoriesTable');
            tbody.innerHTML = DB.categories.map(c => `
                <tr>
                    <td><strong>${c.name}</strong></td>
                    <td><i class="fas ${c.icon}"></i> (${c.icon})</td>
                    <td>
                        <button class="btn-gold btn-sm btn-danger" onclick="deleteCategory(${c.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function openCatModal() {
            document.getElementById('modalTitle').innerText = 'إضافة تصنيف جديد';
            document.getElementById('modalBody').innerHTML = `
                <form onsubmit="saveCategory(event)">
                    <div style="margin-bottom:12px;">
                        <label>اسم التصنيف *</label>
                        <input type="text" id="catName" class="form-control" required placeholder="مثال: مطاعم">
                    </div>
                    <div style="margin-bottom:12px;">
                        <label>أيقونة FontAwesome</label>
                        <input type="text" id="catIcon" class="form-control" placeholder="fa-utensils">
                    </div>
                    <button type="submit" class="btn-gold" style="width:100%; justify-content:center; margin-top:10px;">إضافة</button>
                </form>
            `;
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function saveCategory(e) {
            e.preventDefault();
            const name = document.getElementById('catName').value;
            const icon = document.getElementById('catIcon').value || 'fa-tag';
            DB.categories.push({ id: Date.now(), name, icon });
            saveDB();
            closeModal();
            renderCategories();
        }

        function deleteCategory(id) {
            if(confirm('حذف التصنيف؟')) {
                DB.categories = DB.categories.filter(c => c.id !== id);
                saveDB();
                renderCategories();
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        // التشغيل التلقائي
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
