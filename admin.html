<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | يمن ريتغ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/yemen-rating.css">
    <style>
        .hidden { display:none !important; }
        .admin-wrapper { display:flex; min-height:100vh; }
        .admin-sidebar { width:260px; background:var(--navy-900, #0a1120); color:#fff; position:fixed; top:0; right:0; height:100vh; overflow-y:auto; z-index:100; border-left:1px solid var(--navy-600, #1e293b); transition:transform 0.3s; }
        .sidebar-brand { display:flex; align-items:center; gap:12px; padding:22px 20px; border-bottom:1px solid var(--navy-700, #152033); }
        .sidebar-brand .brand-mark { width:42px; height:42px; background:var(--gold-gradient, linear-gradient(135deg, #fbbf24, #d4af37)); border-radius:var(--radius-sm, 6px); display:flex; align-items:center; justify-content:center; color:#0d1b2a; font-size:1.2rem; }
        .sidebar-brand span { font-weight:800; color:var(--gold-400, #fbbf24); font-size:1.05rem; }
        .sidebar-nav { padding:16px 12px; }
        .nav-item { display:flex; align-items:center; gap:12px; padding:12px 16px; color:#94a3b8; border-radius:var(--radius-sm, 6px); margin-bottom:4px; transition:all 0.2s; text-decoration:none; font-weight:600; cursor:pointer; }
        .nav-item i { width:20px; text-align:center; color:var(--gold-400, #fbbf24); }
        .nav-item:hover { background:var(--navy-700, #152033); color:#fff; }
        .nav-item.active { background:var(--gold-gradient, linear-gradient(135deg, #fbbf24, #d4af37)); color:#0d1b2a; font-weight:800; }
        .nav-item.active i { color:#0d1b2a; }
        .admin-main { flex:1; margin-right:260px; min-height:100vh; background: #0b1329; color: #fff; }
        .admin-header { background:var(--bg-section, #0f172a); padding:16px 28px; display:flex; align-items:center; gap:18px; position:sticky; top:0; z-index:50; border-bottom:1px solid #1e293b; }
        .admin-header h1 { font-size:1.3rem; color:#fff; flex:1; font-weight:800; }
        .admin-content { padding:28px; }
        .admin-login { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0a1120; padding:20px; }
        .login-card { background:#0f172a; border:1px solid #fbbf24; border-radius:12px; padding:44px 40px; width:100%; max-width:420px; text-align:center; }
        .login-logo { width:70px; height:70px; background:linear-gradient(135deg, #fbbf24, #d4af37); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:2rem; color:#0a1120; margin:0 auto 20px; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px; margin-bottom:28px; }
        .stat-card { background:#0f172a; border-radius:8px; padding:22px; display:flex; align-items:center; gap:16px; border:1px solid #1e293b; border-right:4px solid #fbbf24; }
        .stat-card .icon { width:52px; height:52px; background:linear-gradient(135deg, #fbbf24, #d4af37); color:#0a1120; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; }
        .stat-card .num { font-size:1.7rem; font-weight:900; color:#fbbf24; }
        .stat-card .lbl { color:#94a3b8; font-size:0.85rem; }
        .table-wrapper { background:#0f172a; border-radius:8px; overflow-x:auto; border:1px solid #1e293b; margin-top: 15px; }
        .admin-table { width:100%; border-collapse:collapse; min-width:700px; }
        .admin-table th { background:#152033; color:#fbbf24; padding:14px 16px; text-align:right; font-size:0.88rem; font-weight:700; }
        .admin-table td { padding:14px 16px; border-bottom:1px solid #1e293b; font-size:0.9rem; color:#e2e8f0; }
        .icon-btn { width:34px; height:34px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; border:none; cursor:pointer; font-size:0.85rem; margin:0 2px; }
        .icon-btn.edit { background:rgba(59,130,246,0.2); color:#60a5fa; }
        .icon-btn.toggle { background:rgba(245,158,11,0.2); color:#fbbf24; }
        .icon-btn.delete { background:rgba(239,68,68,0.2); color:#f87171; }
        .panel-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; }
        .panel-header h2 { color:#fff; font-size:1.4rem; font-weight:800; }
        .tab-panel { display:none; }
        .tab-panel.active { display:block; }
        .search-bar { padding: 10px 14px; background: #152033; border: 1px solid #334155; border-radius: 8px; color: #fff; width: 250px; font-family: 'Cairo', sans-serif; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; }
        .modal-card { background:#0f172a; border:1px solid #fbbf24; border-radius:12px; padding:24px; width:100%; max-width:600px; max-height:90vh; overflow-y:auto; color:#fff; }
        .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #1e293b; padding-bottom:10px; }
        .form-group { margin-bottom:15px; text-align:right; }
        .form-group label { display:block; margin-bottom:6px; color:#cbd5e1; font-size:0.9rem; }
        .form-control { width:100%; padding:10px 14px; background:#152033; border:1px solid #334155; border-radius:6px; color:#fff; font-family:'Cairo', sans-serif; box-sizing:border-box; }
        .btn-gold { background:linear-gradient(135deg, #fbbf24, #d4af37); color:#0a1120; font-weight:800; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-family:'Cairo', sans-serif; }
        @media (max-width:900px) {
            .admin-sidebar { transform:translateX(100%); width:280px; }
            .admin-sidebar.open { transform:translateX(0); }
            .admin-main { margin-right:0; }
            .admin-content { padding:16px; }
        }
    </style>
</head>
<body>

    <!-- زر الرجوع للموقع الرئيسي -->
    <div style="position:fixed; bottom:20px; left:20px; z-index:999;">
        <a href="index.html" class="btn-gold" style="text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
            <i class="fas fa-arrow-right"></i> العودة للموقع
        </a>
    </div>

    <!-- شاشة التسجيل -->
    <div class="admin-login" id="adminLogin">
        <div class="login-card">
            <div class="login-logo"><i class="fas fa-star"></i></div>
            <h1 style="color:#fbbf24;margin-bottom:6px;">لوحة إدارة يمن ريتغ</h1>
            <p style="color:#94a3b8;margin-bottom:26px;">دخول الإدارة فقط</p>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label>كلمة المرور للإدارة</label>
                    <input type="password" class="form-control" id="adminPass" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-gold" style="width:100%; margin-top:10px;"><i class="fas fa-right-to-bracket"></i> دخول</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="admin-wrapper hidden" id="adminWrapper">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-brand">
                <div class="brand-mark"><i class="fas fa-star"></i></div>
                <span>YR Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item active" onclick="YRA.switchTab('dashboard',this)"><i class="fas fa-gauge-high"></i><span>الرئيسية</span></a>
                <a class="nav-item" onclick="YRA.switchTab('entities',this)"><i class="fas fa-building"></i><span>الشركات والبنوك</span></a>
                <a class="nav-item" onclick="YRA.switchTab('categories',this)"><i class="fas fa-tags"></i><span>التصنيفات</span></a>
                <a class="nav-item" onclick="YRA.logout()" style="color:#f87171;"><i class="fas fa-right-from-bracket"></i><span>خروج</span></a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <button onclick="document.getElementById('adminSidebar').classList.toggle('open')" style="background:none; border:none; color:#fbbf24; font-size:1.3rem; cursor:pointer;"><i class="fas fa-bars"></i></button>
                <h1 id="pageTitle">الرئيسية</h1>
                <span style="color:#fbbf24;font-weight:700;">المدير العام</span>
            </header>

            <div class="admin-content">
                <!-- الرئيسية -->
                <section class="tab-panel active" id="panel-dashboard">
                    <div class="stats-grid" id="dashStats"></div>
                </section>

                <!-- إدارة المنشآت (entities) -->
                <section class="tab-panel" id="panel-entities">
                    <div class="panel-header">
                        <h2>إدارة الشركات والبنوك</h2>
                        <input type="text" class="search-bar" id="searchEntities" placeholder="بحث بالاسم..." oninput="YRA.filterEntities()">
                        <button class="btn-gold" onclick="YRA.openAddEntityModal()"><i class="fas fa-plus"></i> إضافة جديد</button>
                    </div>
                    <div class="table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>الاسم</th>
                                    <th>المدينة</th>
                                    <th>الوصف</th>
                                    <th>الحالة</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="entitiesBody"></tbody>
                        </table>
                    </div>
                </section>

                <!-- إدارة التصنيفات (categories) -->
                <section class="tab-panel" id="panel-categories">
                    <div class="panel-header">
                        <h2>إدارة التصنيفات</h2>
                        <button class="btn-gold" onclick="YRA.openAddCategoryModal()"><i class="fas fa-plus"></i> إضافة تصنيف</button>
                    </div>
                    <div class="table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>الأيقونة</th>
                                    <th>اسم التصنيف</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="categoriesBody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div id="modalRoot"></div>

    <script src="js/supabase.js"></script>
    <script>
        const YRA = {
            allEntities: [],
            
            async init() {
                if (sessionStorage.getItem('yr_admin_auth') === 'true') {
                    this.showDashboard();
                } else {
                    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
                        e.preventDefault();
                        const pass = document.getElementById('adminPass').value;
                        if (pass === 'admin123' || pass === '123456') { // كلمة المرور الافتراضية
                            sessionStorage.setItem('yr_admin_auth', 'true');
                            this.showDashboard();
                        } else {
                            alert('كلمة المرور غير صحيحة!');
                        }
                    });
                }
            },

            async showDashboard() {
                document.getElementById('adminLogin').classList.add('hidden');
                document.getElementById('adminWrapper').classList.remove('hidden');
                if (typeof initSupabase === 'function') await initSupabase();
                this.renderStats();
            },

            logout() {
                sessionStorage.removeItem('yr_admin_auth');
                location.reload();
            },

            switchTab(tab, el) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                if (el) el.classList.add('active');
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + tab).classList.add('active');
                document.getElementById('adminSidebar').classList.remove('open');
                
                if (tab === 'entities') this.loadEntities();
                if (tab === 'categories') this.loadCategories();
                if (tab === 'dashboard') this.renderStats();
            },

            async renderStats() {
                const client = window.sb;
                let entCount = 0, catCount = 0;
                if (client) {
                    const { count: c1 } = await client.from('entities').select('*', { count: 'exact', head: true });
                    const { count: c2 } = await client.from('categories').select('*', { count: 'exact', head: true });
                    entCount = c1 || 0;
                    catCount = c2 || 0;
                }
                document.getElementById('dashStats').innerHTML = `
                    <div class="stat-card"><div class="icon"><i class="fas fa-building"></i></div><div><div class="num">${entCount}</div><div class="lbl">شركة وبنك</div></div></div>
                    <div class="stat-card"><div class="icon"><i class="fas fa-tags"></i></div><div><div class="num">${catCount}</div><div class="lbl">تصنيف</div></div></div>
                `;
            },

            // === إدارة المنشآت ===
            async loadEntities() {
                const client = window.sb;
                if (!client) return;
                const { data } = await client.from('entities').select('*').order('created_at', { ascending: false });
                this.allEntities = data || [];
                this.renderEntitiesTable(this.allEntities);
            },

            renderEntitiesTable(list) {
                const body = document.getElementById('entitiesBody');
                if (!list || list.length === 0) {
                    body.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">لا توجد بيانات مضافة</td></tr>';
                    return;
                }
                body.innerHTML = list.map(item => `
                    <tr>
                        <td><strong>${item.name}</strong></td>
                        <td>${item.city || 'صنعاء'}</td>
                        <td>${item.description || '-'}</td>
                        <td><span style="color:${item.is_active !== false ? '#22c55e' : '#ef4444'};">${item.is_active !== false ? '🟢 ظاهر' : '🔴 مخفي'}</span></td>
                        <td>
                            <button class="icon-btn edit" title="تعديل" onclick="YRA.openEditEntityModal('${item.id}')"><i class="fas fa-edit"></i></button>
                            <button class="icon-btn toggle" title="إخفاء/إظهار" onclick="YRA.toggleEntityStatus('${item.id}', ${item.is_active !== false})"><i class="fas fa-eye"></i></button>
                            <button class="icon-btn delete" title="حذف" onclick="YRA.deleteEntity('${item.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            },

            filterEntities() {
                const q = document.getElementById('searchEntities').value.toLowerCase();
                const filtered = this.allEntities.filter(e => e.name.toLowerCase().includes(q));
                this.renderEntitiesTable(filtered);
            },

            async toggleEntityStatus(id, currentStatus) {
                const client = window.sb;
                await client.from('entities').update({ is_active: !currentStatus }).eq('id', id);
                this.loadEntities();
            },

            async deleteEntity(id) {
                if (!confirm('هل أنت تأكد من رغبتك في حذف هذا العنصر نهائياً؟')) return;
                const client = window.sb;
                await client.from('entities').delete().eq('id', id);
                this.loadEntities();
            },

            openAddEntityModal() {
                this.renderEntityForm();
            },

            openEditEntityModal(id) {
                const item = this.allEntities.find(e => e.id == id);
                if (item) this.renderEntityForm(item);
            },

            renderEntityForm(item = null) {
                const isEdit = !!item;
                const modalHtml = `
                    <div class="modal-overlay">
                        <div class="modal-card">
                            <div class="modal-head">
                                <h3>${isEdit ? 'تعديل بيانات المنشأة' : 'إضافة شركة أو بنك جديد'}</h3>
                                <button onclick="YRA.closeModal()" style="background:none; border:none; color:#fff; cursor:pointer;"><i class="fas fa-times"></i></button>
                            </div>
                            <form id="entityForm">
                                <div class="form-group">
                                    <label>اسم المنشأة *</label>
                                    <input type="text" class="form-control" name="name" value="${item ? item.name : ''}" required>
                                </div>
                                <div class="form-group">
                                    <label>المدينة</label>
                                    <input type="text" class="form-control" name="city" value="${item ? item.city || '' : 'صنعاء'}">
                                </div>
                                <div class="form-group">
                                    <label>الوصف</label>
                                    <textarea class="form-control" name="description">${item ? item.description || '' : ''}</textarea>
                                </div>
                                <div class="form-group">
                                    <label>رقم الهاتف</label>
                                    <input type="text" class="form-control" name="phone" value="${item ? item.phone || '' : ''}">
                                </div>
                                <div class="form-group">
                                    <label>الموقع الإلكتروني</label>
                                    <input type="url" class="form-control" name="website" value="${item ? item.website || '' : ''}">
                                </div>
                                <button type="submit" class="btn-gold" style="width:100%; margin-top:15px;">حفظ البيانات</button>
                            </form>
                        </div>
                    </div>
                `;
                document.getElementById('modalRoot').innerHTML = modalHtml;

                document.getElementById('entityForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const fd = new FormData(e.target);
                    const payload = {
                        name: fd.get('name'),
                        city: fd.get('city'),
                        description: fd.get('description'),
                        phone: fd.get('phone'),
                        website: fd.get('website'),
                        is_active: true
                    };
                    const client = window.sb;
                    if (isEdit) {
                        await client.from('entities').update(payload).eq('id', item.id);
                    } else {
                        await client.from('entities').insert([payload]);
                    }
                    this.closeModal();
                    this.loadEntities();
                });
            },

            // === إدارة التصنيفات ===
            async loadCategories() {
                const client = window.sb;
                if (!client) return;
                const { data } = await client.from('categories').select('*');
                const body = document.getElementById('categoriesBody');
                if (!data || data.length === 0) {
                    body.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px;">لا توجد تصنيفات</td></tr>';
                    return;
                }
                body.innerHTML = data.map(c => `
                    <tr>
                        <td><i class="fas ${c.icon || 'fa-tag'}" style="color:#fbbf24;"></i></td>
                        <td><strong>${c.name}</strong></td>
                        <td>
                            <button class="icon-btn delete" onclick="YRA.deleteCategory('${c.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            },

            openAddCategoryModal() {
                const modalHtml = `
                    <div class="modal-overlay">
                        <div class="modal-card">
                            <div class="modal-head">
                                <h3>إضافة تصنيف جديد</h3>
                                <button onclick="YRA.closeModal()" style="background:none; border:none; color:#fff; cursor:pointer;"><i class="fas fa-times"></i></button>
                            </div>
                            <form id="catForm">
                                <div class="form-group">
                                    <label>اسم التصنيف *</label>
                                    <input type="text" class="form-control" name="name" required placeholder="مثال: بنوك، اتصالات...">
                                </div>
                                <div class="form-group">
                                    <label>اسم الأيقونة (FontAwesome)</label>
                                    <input type="text" class="form-control" name="icon" placeholder="fa-landmark">
                                </div>
                                <button type="submit" class="btn-gold" style="width:100%; margin-top:15px;">إضافة</button>
                            </form>
                        </div>
                    </div>
                `;
                document.getElementById('modalRoot').innerHTML = modalHtml;

                document.getElementById('catForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const fd = new FormData(e.target);
                    const client = window.sb;
                    await client.from('categories').insert([{
                        name: fd.get('name'),
                        icon: fd.get('icon') || 'fa-tag'
                    }]);
                    this.closeModal();
                    this.loadCategories();
                });
            },

            async deleteCategory(id) {
                if (!confirm('حذف هذا التصنيف؟')) return;
                const client = window.sb;
                await client.from('categories').delete().eq('id', id);
                this.loadCategories();
            },

            closeModal() {
                document.getElementById('modalRoot').innerHTML = '';
            }
        };

        document.addEventListener('DOMContentLoaded', () => YRA.init());
    </script>
</body>
</html>
