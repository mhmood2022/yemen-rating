<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التسجيل | يمن ريتغ — Yemen Rating</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<style>
:root{--navy-900:#0a1120;--navy-800:#0f172a;--navy-700:#152033;--navy-600:#1e293b;--gold-500:#d4af37;--gold-400:#fbbf24;--success:#10b981;--danger:#ef4444;--text-main:#f8fafc;--text-muted:#94a3b8;--text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;--text-xl:1.25rem}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--navy-900);color:var(--text-main);line-height:1.6}
body.light-mode{--navy-900:#f8fafc;--navy-800:#fff;--navy-700:#f1f5f9;--navy-600:#e2e8f0;--text-main:#0f172a;--text-muted:#475569}
.container{max-width:1100px;margin:0 auto;padding:0 20px}
a{text-decoration:none;color:inherit}
.site-header{background:var(--navy-800);border-bottom:1px solid var(--navy-600);position:sticky;top:0;z-index:1000;padding:12px 0}
.header-inner{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--gold-400),var(--gold-500));border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--navy-900);font-size:1rem}
.brand-text{text-align:right}
.brand-text strong{color:var(--gold-400);font-size:1rem;letter-spacing:.5px;display:block;line-height:1.2}
.brand-text span{font-size:.75rem;font-weight:600;color:#fff}
.nav-toggle{background:transparent;border:1px solid var(--navy-600);color:var(--gold-400);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:1.1rem}
#mainNav{position:fixed;top:0;right:-100%;width:280px;height:100vh;background:var(--navy-800);border-left:1px solid var(--gold-500);z-index:2000;transition:.3s;padding:20px;overflow-y:auto}
#mainNav.open{right:0}
.nav-close-btn{background:var(--navy-700);border:none;color:var(--gold-400);width:35px;height:35px;border-radius:50%;cursor:pointer;position:absolute;top:15px;left:15px}
.nav-head{display:flex;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--gold-500)}
.nav-head .txt{text-align:center;flex:1}
.nav-head .en{color:var(--gold-400);font-size:1.05rem;font-weight:800}
.nav-head .ar{color:#fff;font-size:.85rem}
#mainNav ul{list-style:none;display:flex;flex-direction:column;gap:8px}
#mainNav a{display:flex;align-items:center;gap:10px;color:var(--text-main);padding:10px 12px;border-radius:8px;font-weight:600;font-size:var(--text-sm)}
#mainNav i{width:18px;text-align:center;color:var(--gold-400)}
.nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1500;display:none}
.nav-overlay.active{display:block}
.auth-wrap{max-width:480px;margin:40px auto;padding:0 20px}
.auth-card{background:var(--navy-800);border:1px solid var(--gold-500);border-radius:14px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.auth-title{text-align:center;margin-bottom:20px}
.auth-title h1{color:var(--gold-400);font-size:var(--text-lg);font-weight:800}
.auth-title p{color:var(--text-muted);font-size:var(--text-xs)}
.tabs{display:flex;background:var(--navy-900);border-radius:10px;padding:4px;margin-bottom:20px}
.tab-btn{flex:1;padding:10px;border:none;border-radius:8px;background:transparent;color:var(--text-muted);font-family:inherit;font-weight:700;font-size:var(--text-xs);cursor:pointer;transition:.2s}
.tab-btn.active{background:linear-gradient(135deg,var(--gold-400),var(--gold-500));color:var(--navy-900)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:var(--text-xs);color:var(--text-muted);margin-bottom:5px;font-weight:600}
.form-control{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--navy-600);background:var(--navy-900);color:var(--text-main);font-family:inherit;font-size:var(--text-sm);outline:none}
.form-control:focus{border-color:var(--gold-500)}
.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.role-card{background:var(--navy-900);border:2px solid var(--navy-600);border-radius:10px;padding:14px 8px;text-align:center;cursor:pointer;transition:.2s}
.role-card.active{border-color:var(--gold-400);background:rgba(251,191,36,.08)}
.role-card i{font-size:1.3rem;color:var(--gold-400);display:block;margin-bottom:6px}
.role-card span{font-size:var(--text-xs);font-weight:700}
.custom-select{position:relative;width:100%}
.custom-select-trigger{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--navy-600);background:var(--navy-900);color:var(--text-main);font-size:.75rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.custom-select-trigger::after{content:"\f078";font-family:"Font Awesome 5 Free";font-weight:900;font-size:.6rem;color:var(--gold-400)}
.custom-options{position:absolute;top:calc(100% + 4px);right:0;left:0;background:var(--navy-800);border:1px solid var(--gold-500);border-radius:8px;max-height:0;overflow:hidden;opacity:0;transition:.25s;z-index:100}
.custom-select.open .custom-options{max-height:220px;opacity:1;overflow-y:auto;padding:4px 0}
.custom-option{padding:10px 14px;font-size:.75rem;cursor:pointer;display:flex;align-items:center;gap:8px}
.custom-option:hover{background:var(--navy-700);color:var(--gold-400)}
.custom-option.selected{background:rgba(251,191,36,.12);color:var(--gold-400);font-weight:700}
.btn{padding:12px;border-radius:50px;border:none;cursor:pointer;font-weight:800;font-size:var(--text-sm);font-family:inherit;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-gold{background:linear-gradient(135deg,var(--gold-400),var(--gold-500));color:var(--navy-900)}
.note{background:rgba(251,191,36,.06);border:1px dashed var(--gold-500);border-radius:8px;padding:10px;font-size:.65rem;color:var(--gold-400);margin-top:14px;display:flex;gap:8px;align-items:center}
.toast{position:fixed;top:20px;left:20px;background:var(--navy-700);border:1px solid var(--gold-500);color:#fff;padding:12px 20px;border-radius:10px;z-index:9999;font-size:var(--text-xs);font-family:'Cairo',sans-serif}
#floatingBackBtn{position:fixed;bottom:20px;right:20px;width:45px;height:45px;border-radius:50%;background:var(--navy-700);border:1px solid var(--gold-500);color:var(--gold-400);font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:999}
</style>
</head>
<body>

<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand"><div class="brand-mark"><i class="fas fa-star"></i></div><div class="brand-text"><strong>YEMEN RATING</strong><span>يمن ريتغ</span></div></a>
        <div style="display:flex;gap:8px;align-items:center"><a href="register.html" class="auth-btn" style="background:linear-gradient(135deg,var(--gold-400),var(--gold-500));color:var(--navy-900);padding:7px 14px;border-radius:50px;font-size:.7rem;font-weight:800;display:inline-flex;align-items:center;gap:5px"><i class="fas fa-user"></i> دخول</a><button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button></div>
    </div>
</header>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-title">
            <h1><i class="fas fa-star"></i> بوابة يمن ريتغ</h1>
            <p id="adminNote" style="display:none;color:var(--danger)">🔐 وضع دخول الإدارة</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" id="tabReg" onclick="switchTab('reg')">حساب جديد</button>
        </div>

        <!-- تسجيل الدخول -->
        <form id="loginForm" onsubmit="doLogin(event)">
            <div class="form-group"><label>رقم الهاتف أو البريد الإلكتروني</label><input type="text" class="form-control" id="loginId" required></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" class="form-control" id="loginPass" required></div>
            <button type="submit" class="btn btn-gold"><i class="fas fa-sign-in-alt"></i> دخول</button>
        </form>

        <!-- حساب جديد -->
        <form id="regForm" style="display:none" onsubmit="doRegister(event)">
            <div class="role-cards">
                <div class="role-card active" id="roleUser" onclick="setRole('user')"><i class="fas fa-user"></i><span>مستخدم / مقيّم</span></div>
                <div class="role-card" id="roleOwner" onclick="setRole('owner')"><i class="fas fa-briefcase"></i><span>مالك منشأة</span></div>
            </div>
            <div class="form-group" id="etypeGroup" style="display:none"><label>نوع المنشأة</label>
                <div class="custom-select" id="etypeSelect">
                    <div class="custom-select-trigger"><span>شركة</span></div>
                    <div class="custom-options">
                        <div class="custom-option selected" data-value="company">شركة</div>
                        <div class="custom-option" data-value="bank">بنك</div>
                        <div class="custom-option" data-value="shop">محل</div>
                        <div class="custom-option" data-value="hotel">فندق</div>
                        <div class="custom-option" data-value="restaurant">مطعم</div>
                        <div class="custom-option" data-value="exchange">صرافة</div>
                        <div class="custom-option" data-value="transport">شركة نقل</div>
                        <div class="custom-option" data-value="wallet">محفظة إلكترونية</div>
                    </div>
                </div>
            </div>
            <div class="form-group"><label>الاسم الكامل</label><input type="text" class="form-control" id="regName" required></div>
            <div class="form-group"><label>رقم الهاتف</label><input type="tel" class="form-control" id="regPhone" required></div>
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" class="form-control" id="regEmail"></div>
            <div class="form-group"><label>كلمة المرور</label><input type="password" class="form-control" id="regPass" required minlength="6"></div>
            <button type="submit" class="btn btn-gold"><i class="fas fa-user-plus"></i> إنشاء الحساب</button>
            <div class="note"><i class="fas fa-shield-alt"></i> حسابات الملاك تُفعَّل بعد مراجعة الإدارة</div>
        </form>
    </div>
</div>

<div class="nav-overlay" id="navOverlay"></div>
<nav id="mainNav">
    <button class="nav-close-btn" id="navClose"><i class="fas fa-arrow-right"></i></button>
    <div class="nav-head"><button id="mobileThemeToggle" style="background:var(--navy-700);border:1px solid var(--navy-600);color:var(--gold-400);width:36px;height:36px;border-radius:50%;cursor:pointer"><i class="fas fa-moon" id="mobileThemeIcon"></i></button><div class="txt"><div class="en">YEMEN RATING</div><div class="ar">يمن ريتغ ⭐</div></div><div style="width:36px"></div></div>
    <ul>
        <li><a href="index.html"><i class="fas fa-home"></i> الرئيسية</a></li>
        <li><a href="companies.html"><i class="fas fa-building"></i> الشركات</a></li>
        <li><a href="banks.html"><i class="fas fa-landmark"></i> البنوك</a></li>
        <li><a href="jobs.html"><i class="fas fa-briefcase"></i> الوظائف</a></li>
        <li style="margin-top:10px;padding-top:10px;border-top:1px solid var(--navy-600)"><a href="register.html" style="background:rgba(251,191,36,.1);color:var(--gold-400)"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول / حساب جديد</a></li>
    </ul>
</nav>

<button id="floatingBackBtn" onclick="smartBack()"><i class="fas fa-arrow-right"></i></button>

<script>
let curRole='user', curEtype='company';

// قراءة ?type=company من زر "أضف شركتك"
if(new URLSearchParams(window.location.search).get('type')){
    switchTab('reg'); setRole('owner');
}
// دخول الإدارة المخفي: register.html?role=admin
if(new URLSearchParams(window.location.search).get('role')==='admin'){
    document.getElementById('adminNote').style.display='flex';
    switchTab('login');
}

function switchTab(t){
    document.getElementById('tabLogin').classList.toggle('active',t==='login');
    document.getElementById('tabReg').classList.toggle('active',t==='reg');
    document.getElementById('loginForm').style.display=t==='login'?'block':'none';
    document.getElementById('regForm').style.display=t==='reg'?'block':'none';
}
function setRole(r){
    curRole=r;
    document.getElementById('roleUser').classList.toggle('active',r==='user');
    document.getElementById('roleOwner').classList.toggle('active',r==='owner');
    document.getElementById('etypeGroup').style.display=r==='owner'?'block':'none';
}

// قائمة نوع المنشأة المخصصة
const es=document.getElementById('etypeSelect');
es.querySelector('.custom-select-trigger').addEventListener('click',e=>{e.stopPropagation();es.classList.toggle('open')});
es.querySelectorAll('.custom-option').forEach(o=>o.addEventListener('click',()=>{
    es.querySelectorAll('.custom-option').forEach(x=>x.classList.remove('selected'));
    o.classList.add('selected');
    es.querySelector('.custom-select-trigger span').textContent=o.textContent.trim();
    curEtype=o.dataset.value; es.classList.remove('open');
}));
document.addEventListener('click',()=>es.classList.remove('open'));

function getUsers(){try{return JSON.parse(localStorage.getItem('yr_users'))||[]}catch(e){return[]}}
function saveUsers(u){localStorage.setItem('yr_users',JSON.stringify(u))}

async function doRegister(e){
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPass').value;
    
    // Try Supabase first
    const result = await handleSupabaseSignUp(email, password, name, phone, curRole);
    
    if (result.success) {
        showToast(curRole==='owner'?'✅ تم استلام طلبك! سيُفعَّل بعد مراجعة الإدارة':'✅ تم إنشاء حسابك بنجاح');
        e.target.reset();
        switchTab('login');
    } else {
        // Fallback to localStorage if Supabase fails
        console.warn('Supabase signup failed, using localStorage:', result.error);
        const users=getUsers();
        if(users.find(u=>u.phone===phone)){showToast('⚠️ هذا الرقم مسجل مسبقاً — سجل دخولك');return}
        users.push({
            name, phone, email, pass:password,
            role:curRole,
            etype:curRole==='owner'?curEtype:null,
            status:curRole==='owner'?'PENDING':'ACTIVE',
            created:new Date().toISOString()
        });
        saveUsers(users);
        showToast(curRole==='owner'?'✅ تم استلام طلبك! سيُفعَّل بعد مراجعة الإدارة':'✅ تم إنشاء حسابك بنجاح');
        e.target.reset();
        switchTab('login');
    }
}

async function doLogin(e){
    e.preventDefault();
    const id=document.getElementById('loginId').value.trim();
    const pass=document.getElementById('loginPass').value;
    const isAdmin=document.getElementById('adminNote').style.display!=='none';
    
    if(isAdmin){
        if(id==='admin'&&pass==='admin2026'){
            localStorage.setItem('yr_session',JSON.stringify({role:'admin',name:'الإدارة'}));
            showToast('✅ مرحباً بالإدارة');
            setTimeout(()=>location.href='admin.html',800);
        } else {
            showToast('⚠️ بيانات الإدارة غير صحيحة');
        }
        return;
    }
    
    // Try Supabase first
    const result = await handleSupabaseSignIn(id, pass);
    
    if (result.success && result.profile) {
        if (result.profile.status === 'PENDING') {
            showToast('⏳ حسابك قيد مراجعة الإدارة');
            return;
        }
        localStorage.setItem('yr_session', JSON.stringify({
            role: result.profile.role,
            name: result.profile.full_name,
            userId: result.user.id,
            source: 'supabase'
        }));
        showToast('✅ مرحباً ' + result.profile.full_name);
        setTimeout(() => location.href = result.profile.role === 'company_owner' ? 'owner.html' : 'index.html', 800);
    } else {
        // Fallback to localStorage
        console.warn('Supabase signin failed, using localStorage:', result.error);
        const u=getUsers().find(u=>(u.phone===id||u.email===id)&&u.pass===pass);
        if(!u){showToast('⚠️ بيانات الدخول غير صحيحة');return}
        if(u.status==='PENDING'){showToast('⏳ حسابك قيد مراجعة الإدارة');return}
        localStorage.setItem('yr_session',JSON.stringify({role:u.role,name:u.name,etype:u.etype}));
        showToast('✅ مرحباً '+u.name);
        setTimeout(()=>location.href=u.role==='owner'?'owner.html':'index.html',800);
    }
}

function smartBack(){if(document.getElementById('mainNav').classList.contains('open')){closeNav();return}if(window.history.length>1)window.history.back();else window.location.href='index.html'}
function showToast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}

document.getElementById('navToggle').addEventListener('click',()=>{document.getElementById('mainNav').classList.add('open');document.getElementById('navOverlay').classList.add('active');document.body.style.overflow='hidden'});
const closeNav=()=>{document.getElementById('mainNav').classList.remove('open');document.getElementById('navOverlay').classList.remove('active');document.body.style.overflow=''};
document.getElementById('navClose').addEventListener('click',closeNav);
document.getElementById('navOverlay').addEventListener('click',closeNav);
const body=document.body;
if(localStorage.getItem('yr_theme')==='light')body.classList.add('light-mode');
const updIcon=()=>{document.getElementById('mobileThemeIcon').className=body.classList.contains('light-mode')?'fas fa-sun':'fas fa-moon'};
updIcon();
document.getElementById('mobileThemeToggle').addEventListener('click',e=>{e.preventDefault();body.classList.toggle('light-mode');localStorage.setItem('yr_theme',body.classList.contains('light-mode')?'light':'dark');updIcon()});
</script>
<script src="js/admin-engine.js"></script>
<script src="js/ads-loader.js"></script>
</body>
</html>
