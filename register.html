<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>إنشاء حساب جديد | يمن ريتغ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F59E0B">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/yemen-rating.css">
    <style>
        :root {
            --navy-950: #040D1A;
            --navy-900: #0A192F;
            --navy-800: #112240;
            --gold-500: #F59E0B;
            --gold-400: #FBBF24;
            --border: #1E293B;
            --text-muted: #94A3B8;
            --bg-card: #0D1E36;
            --radius-md: 12px;
        }
        body { font-family: 'Cairo', sans-serif; background: var(--navy-950); color: #F8FAFC; margin: 0; padding: 0; direction: rtl; min-height: 100vh; display: flex; flex-direction: column; }
        .reg-container { width: 100%; max-width: 580px; margin: 40px auto; padding: 0 16px; flex: 1; }
        .reg-card { background: var(--navy-900); border: 1px solid var(--gold-500); border-radius: 16px; padding: clamp(20px, 5vw, 32px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .reg-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; background: #040d1a; padding: 6px; border-radius: 10px; }
        .reg-tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 10px; border-radius: 8px; font-weight: 700; font-family: 'Cairo'; cursor: pointer; transition: 0.2s; }
        .reg-tab-btn.active { background: linear-gradient(135deg, #F59E0B, #D97706); color: var(--navy-950); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.88rem; color: var(--text-muted); margin-bottom: 6px; }
        .form-control { width: 100%; background: #040d1a; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-family: 'Cairo'; font-size: 0.92rem; outline: none; box-sizing: border-box; }
        .form-control:focus { border-color: var(--gold-500); }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #F59E0B, #D97706); color: var(--navy-950); border: none; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 1rem; font-family: 'Cairo'; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header style="padding: 16px; text-align: center; border-bottom: 1px solid var(--border); background: var(--navy-900);">
        <a href="index.html" style="color: var(--gold-400); text-decoration: none; font-weight: 900; font-size: 1.3rem;">
            <i class="fa-solid fa-star"></i> يمن ريتغ | Yemen Rating
        </a>
    </header>

    <div class="reg-container">
        <div class="reg-card">
            <h2 style="text-align:center;margin:0 0 8px;color:#fff;font-size:1.5rem;">إنشاء حساب جديد</h2>
            <p style="text-align:center;color:var(--text-muted);font-size:0.88rem;margin:0 0 20px;">انضم إلى شبكة التقييم والوظائف الموثوقة الأولى في اليمن</p>

            <div class="reg-tabs">
                <button class="reg-tab-btn active" id="tabCandidate" onclick="RegisterApp.switchTab('candidate')"><i class="fa-solid fa-user-graduate"></i> باحث عن عمل</button>
                <button class="reg-tab-btn" id="tabCompany" onclick="RegisterApp.switchTab('company')"><i class="fa-solid fa-building"></i> منشأة / شركة</button>
            </div>

            <form id="regForm" onsubmit="RegisterApp.submit(event)">
                <input type="hidden" id="accountType" value="user">

                <div class="form-group">
                    <label id="lblFullName">الاسم الكامل *</label>
                    <input type="text" id="regName" class="form-control" required placeholder="محمد علي">
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني *</label>
                    <input type="email" id="regEmail" class="form-control" required placeholder="user@example.com">
                </div>

                <div class="form-group">
                    <label>كلمة المرور *</label>
                    <input type="password" id="regPassword" class="form-control" required placeholder="••••••••" minlength="6">
                </div>

                <div class="form-group">
                    <label>المحافظة / المدينة *</label>
                    <select id="regCity" class="form-control" required>
                        <option value="صنعاء">صنعاء</option>
                        <option value="عدن">عدن</option>
                        <option value="تعز">تعز</option>
                        <option value="حضرموت">حضرموت</option>
                        <option value="إب">إب</option>
                        <option value="الحديدة">الحديدة</option>
                    </select>
                </div>

                <!-- حقول مخصصة للباحث عن عمل -->
                <div id="candidateFields">
                    <div class="form-group">
                        <label>المؤهل والتخصص *</label>
                        <input type="text" id="regSpecialty" class="form-control" placeholder="بكالوريوس تقنية معلومات / محاسبة...">
                    </div>
                    <div class="form-group">
                        <label>سنوات الخبرة</label>
                        <input type="number" id="regExp" class="form-control" placeholder="عدد السنوات (مثلاً 3)" min="0" max="40">
                    </div>
                </div>

                <!-- حقول مخصصة للشركة -->
                <div id="companyFields" style="display:none;">
                    <div class="form-group">
                        <label>مجال نشاط الشركة *</label>
                        <input type="text" id="regActivity" class="form-control" placeholder="تقنية معلومات، مقاولات، تجارة...">
                    </div>
                    <div class="form-group">
                        <label>رقم هاتف المنشأة للتواصل</label>
                        <input type="tel" id="regCompanyPhone" class="form-control" placeholder="77xxxxxxx">
                    </div>
                </div>

                <div style="background:#040d1a;padding:12px;border-radius:8px;font-size:0.8rem;color:var(--text-muted);margin-bottom:16px;line-height:1.5;">
                    <i class="fa-solid fa-shield-halved" style="color:var(--gold-400);"></i> بياناتك محمية ومشفرة وفق أعلى معايير الخصوصية في يمن ريتغ.
                </div>

                <button type="submit" class="btn-submit" id="btnSubmitText"><i class="fa-solid fa-user-plus"></i> إتمام التسجيل</button>
            </form>

            <div style="text-align:center;margin-top:20px;font-size:0.88rem;color:var(--text-muted);">
                لديك حساب بالفعل؟ <a href="index.html" style="color:var(--gold-400);text-decoration:none;font-weight:700;">العودة للرئيسية</a>
            </div>
        </div>
    </div>

    <!-- السكربتات الموحدة -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/db.js"></script>
    <script src="js/sb-sync.js"></script>

    <script>
    const RegisterApp = {
        currentRole: 'user',

        switchTab(role) {
            this.currentRole = role === 'company' ? 'company_owner' : 'user';
            document.getElementById('accountType').value = this.currentRole;

            if (role === 'company') {
                document.getElementById('tabCompany').classList.add('active');
                document.getElementById('tabCandidate').classList.remove('active');
                document.getElementById('candidateFields').style.display = 'none';
                document.getElementById('companyFields').style.display = 'block';
                document.getElementById('lblFullName').innerText = 'اسم المنشأة / الشركة *';
                document.getElementById('regName').placeholder = 'شركة البركة للحلول الرقمية';
            } else {
                document.getElementById('tabCandidate').classList.add('active');
                document.getElementById('tabCompany').classList.remove('active');
                document.getElementById('candidateFields').style.display = 'block';
                document.getElementById('companyFields').style.display = 'none';
                document.getElementById('lblFullName').innerText = 'الاسم الكامل *';
                document.getElementById('regName').placeholder = 'محمد علي';
            }
        },

        async submit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('btnSubmitText');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إنشاء الحساب...';

            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const city = document.getElementById('regCity').value;

            const res = await Auth.register(name, email, password, this.currentRole);

            if (res.success) {
                // حفظ البيانات التكميلية في Supabase
                const client = await getSB();
                if (this.currentRole === 'company_owner') {
                    const activity = document.getElementById('regActivity').value;
                    const phone = document.getElementById('regCompanyPhone').value;
                    await client.from('companies').insert([{
                        owner_id: res.user.id,
                        name: name,
                        city: city,
                        activity: activity,
                        phone: phone,
                        status: 'PENDING'
                    }]);
                }

                alert('🎉 تم إنشاء حسابك بنجاح في يمن ريتغ! سيتم توجيهك الآن.');
                window.location.href = 'index.html';
            } else {
                alert('⚠️ تعذر إنشاء الحساب: ' + (res.error || 'يرجى التحقق من البيانات والمحاولة مجدداً'));
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> إتمام التسجيل';
            }
        }
    };
    </script>
</body>
</html>
