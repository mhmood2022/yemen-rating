<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الإدارة | يمن ريتغ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
:root{--navy-900:#0a1120;--navy-800:#0f172a;--navy-700:#152033;--navy-600:#1e293b;--gold-500:#d4af37;--gold-400:#fbbf24;--danger:#ef4444;--text-main:#f8fafc;--text-muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--navy-900);color:var(--text-main);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--navy-800);border:1px solid var(--gold-500);border-radius:16px;padding:35px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.box h1{color:var(--gold-400);font-size:1.3rem;margin-bottom:8px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.box p{color:var(--text-muted);font-size:.85rem;text-align:center;margin-bottom:24px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;color:var(--text-muted);margin-bottom:6px;font-weight:600}
.form-control{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--navy-600);background:var(--navy-900);color:var(--text-main);font-family:inherit;font-size:.9rem;outline:none}
.form-control:focus{border-color:var(--gold-500)}
.btn{width:100%;padding:12px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:.9rem;font-family:inherit;background:linear-gradient(135deg,var(--gold-400),var(--gold-500));color:var(--navy-900);display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{opacity:.92}
.btn:disabled{opacity:.6;cursor:not-allowed}
.error{background:rgba(239,68,68,.1);border:1px solid var(--danger);color:var(--danger);padding:10px;border-radius:8px;font-size:.8rem;margin-bottom:14px;display:none}
.error.show{display:block}
.back{text-align:center;margin-top:16px;font-size:.8rem}
.back a{color:var(--text-muted);text-decoration:none}
.back a:hover{color:var(--gold-400)}
.spinner{width:16px;height:16px;border:2px solid rgba(10,17,32,.2);border-top-color:var(--navy-900);border-radius:50%;animation:spin 0.8s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
    <h1><i class="fas fa-user-shield"></i> لوحة التحكم</h1>
    <p>يمن ريتغ — دخول الإدارة</p>
    
    <div class="error" id="errBox"></div>
    
    <form id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" class="form-control" id="email" required placeholder="admin@example.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" class="form-control" id="pass" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" id="submitBtn">
            <span id="btnText">دخول</span>
            <div class="spinner" id="spinner"></div>
        </button>
    </form>
    
    <div class="back">
        <a href="index.html"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(
    'https://wkdqeghotlipciqiytuj.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrZHFlZ2hvdGxpcGNpcWl5dHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MDM4NzEsImV4cCI6MjEwMjQ3OTg3MX0.ahqq5okKMXMxuI-8sArjxcVIpPDRmX20mhscs8BaCTE'
);

function showErr(msg) {
    const box = document.getElementById('errBox');
    box.textContent = msg;
    box.classList.add('show');
}

async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const txt = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    btn.disabled = true;
    txt.textContent = 'جاري التحقق...';
    spinner.style.display = 'block';
    document.getElementById('errBox').classList.remove('show');
    
    try {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('pass').value;
        
        const { data: authData, error: authErr } = await sb.auth.signInWithPassword({ email, password: pass });
        if (authErr) throw new Error('البريد أو كلمة المرور غير صحيحة');
        
        const { data: profile, error: profErr } = await sb.from('profiles')
            .select('role, full_name, status, is_blocked')
            .eq('id', authData.user.id)
            .single();
        
        if (profErr || !profile) {
            await sb.auth.signOut();
            throw new Error('حسابك غير مسجل في النظام — تواصل مع الإدارة');
        }
        
        if (profile.role !== 'admin' && profile.role !== 'super_admin') {
            await sb.auth.signOut();
            throw new Error('⛔ هذا الحساب ليس لديه صلاحيات إدارة');
        }
        
        if (profile.status === 'SUSPENDED' || profile.is_blocked) {
            await sb.auth.signOut();
            throw new Error('⛔ حسابك موقوف');
        }
        
        localStorage.setItem('yr_session', JSON.stringify({
            role: profile.role,
            name: profile.full_name || email,
            userId: authData.user.id,
            email: email,
            source: 'supabase'
        }));
        
        location.href = 'admin.html';
    } catch (err) {
        showErr(err.message || 'خطأ غير متوقع');
        btn.disabled = false;
        txt.textContent = 'دخول';
        spinner.style.display = 'none';
    }
}

// إذا كان المستخدم مسجلاً دخولاً مسبقاً ومدير، حوّله مباشرة
(async () => {
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
        const { data: profile } = await sb.from('profiles')
            .select('role')
            .eq('id', user.id)
            .single();
        if (profile && (profile.role === 'admin' || profile.role === 'super_admin')) {
            location.href = 'admin.html';
        }
    }
})();
</script>
</body>
</html>
