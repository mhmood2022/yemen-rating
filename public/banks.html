<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>دليل البنوك والمصارف | يمن ريتنغ</title>

  <!-- خط Tajawal الرسمي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#EAB308',         /* الأصفر الذهبي المعتمد */
              goldHover: '#CA8A04',
              goldLight: '#FEF08A',
              dark: '#000000',
              card: '#0D0D0D',
              cardBorder: '#1F2937'
            }
          },
          fontFamily: {
            tajawal: ['Tajawal', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-btn-active {
      background-color: #EAB308 !important;
      color: #000000 !important;
      font-weight: 800 !important;
    }
  </style>
</head>

<body class="min-h-screen bg-black text-white flex justify-center selection:bg-brand-gold selection:text-black">

  <main class="w-full max-w-2xl min-h-screen bg-black flex flex-col pb-16 px-4 select-none">

    <!-- 1. الهيدر العلوي وشريط التنقل -->
    <header class="py-4 border-b border-zinc-900 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-1.5 text-xs text-zinc-400 hover:text-white transition">
        <i class="fa-solid fa-arrow-right"></i>
        <span>الرئيسية</span>
      </a>

      <div class="text-center">
        <h1 class="text-base font-black text-white flex items-center justify-center gap-2">
          <i class="fa-solid fa-building-columns text-brand-gold"></i>
          <span>دليل البنوك والمصارف</span>
        </h1>
        <p class="text-[10px] text-zinc-400 mt-0.5">البنوك المعتمدة والخدمات المصرفية في اليمن</p>
      </div>

      <span id="banks-count-badge" class="text-[10px] bg-zinc-900 border border-zinc-800 text-brand-gold font-bold px-2.5 py-1 rounded-full">
        جاري التحميل...
      </span>
    </header>

    <!-- 2. حقل البحث السريع بالاسم -->
    <div class="pt-4">
      <div class="relative w-full">
        <input
          type="text"
          id="search-input"
          oninput="handleSearch()"
          placeholder="ابحث عن بنك (مثال: التضامن، الكريمي)..."
          class="w-full bg-[#0D0D0D] border border-zinc-800 rounded-xl py-2.5 pr-10 pl-4 text-xs text-white placeholder-zinc-500 outline-none focus:border-brand-gold transition"
        />
        <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3 text-zinc-500 text-xs"></i>
      </div>
    </div>

    <!-- 3. أزرار الفلترة السريعة للمدن والتوثيق -->
    <div class="py-3 flex items-center gap-2 overflow-x-auto no-scrollbar text-xs">
      <button type="button" onclick="setFilter('all', this)" class="filter-btn filter-btn-active shrink-0 px-3.5 py-1.5 rounded-lg bg-[#0D0D0D] border border-zinc-800 text-zinc-300 transition">
        الكل
      </button>
      <button type="button" onclick="setFilter('verified', this)" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-lg bg-[#0D0D0D] border border-zinc-800 text-zinc-300 hover:text-white transition flex items-center gap-1">
        <i class="fa-solid fa-certificate text-brand-gold text-[11px]"></i>
        <span>الموثقة رسمياً</span>
      </button>
      <button type="button" onclick="setFilter('Sanaa', this)" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-lg bg-[#0D0D0D] border border-zinc-800 text-zinc-300 hover:text-white transition">
        صنعاء
      </button>
      <button type="button" onclick="setFilter('Taiz', this)" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-lg bg-[#0D0D0D] border border-zinc-800 text-zinc-300 hover:text-white transition">
        تعز
      </button>
      <button type="button" onclick="setFilter('Aden', this)" class="filter-btn shrink-0 px-3.5 py-1.5 rounded-lg bg-[#0D0D0D] border border-zinc-800 text-zinc-300 hover:text-white transition">
        عدن
      </button>
    </div>

    <!-- 4. شبكة كروت البنوك الحقيقية -->
    <section id="banks-grid" class="space-y-3 pt-1">
      <div class="text-center py-16 text-zinc-500 text-xs flex flex-col items-center gap-2">
        <i class="fa-solid fa-circle-notch fa-spin text-brand-gold text-xl"></i>
        <span>جاري جلب البنوك المعتمدة من قاعدة البيانات...</span>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://wkdqeghotlipciqiytuj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrZHFlZ2hvdGxpcGNpcWl5dHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MDM4NzEsImV4cCI6MjEwMjQ3OTg3MX0.ahqq5okKMXMxuI-8sArjxcVIpPDRmX20mhscs8BaCTE';

    // بيانات احتياطية ذكية (لبنكي التضامن والكريمي) تضمن عدم توقف الصفحة تحت أي ظرف
    const FALLBACK_BANKS = [
      {
        id: "1d6d2164-edc6-492c-b73d-af60c973ef4a",
        name: "بنك التضامن",
        slug: "tadhamon",
        city: "Taiz - Yemen",
        description: "أكبر بنك في اليمن يقدم خدمات مالية ومصرفية إسلامية تلبي تطلعات عملائه بجودة عالية.",
        logo_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Tadhamon_Bank_Logo.png/640px-Tadhamon_Bank_Logo.png",
        badge_type: "gold",
        verified: true,
        phone: "+9674200000",
        website: "https://tadhamonbank.com",
        avg_rating: "4.5",
        reviews_count: "47"
      },
      {
        id: "kuraimi-demo-id",
        name: "بنك الكريمي للتمويل الأصغر الإسلامي",
        slug: "kuraimi",
        city: "Sanaa - Yemen",
        description: "رائد التمويل الأصغر والخدمات المصرفية وأوسع شبكة فروع وصرافات آلية في جميع محافظات اليمن.",
        logo_url: "https://images.unsplash.com/photo-1616077168079-7e09a677fb2c?w=200&auto=format&fit=crop&q=80",
        badge_type: "gold",
        verified: true,
        phone: "+9671503888",
        website: "https://kuraimibank.com",
        avg_rating: "4.8",
        reviews_count: "68"
      }
    ];

    let allBanks = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // دالة توليد شارة التوثيق المعتمدة
    function renderBadge(badgeType) {
      let color = '#EAB308';
      if (badgeType === 'blue') color = '#1D9BF0';
      if (badgeType === 'gray') color = '#8E8E93';

      return `
        <svg class="w-4 h-4 fill-current inline-block select-none" style="color: ${color}" viewBox="0 0 24 24" title="موثق رسمياً">
          <path d="M22.5 12.5c0-1.58-.88-2.95-2.15-3.6.15-.44.24-.91.24-1.4 0-2.21-1.79-4-4-4-.49 0-.96.08-1.4.24C14.55 2.48 13.18 1.6 11.6 1.6c-1.58 0-2.95.88-3.6 2.15-.44-.16-.91-.25-1.4-.25-2.21 0-4 1.79-4 4 0 .49.08.96.24 1.4C1.58 9.55.7 10.92.7 12.5c0 1.58.88 2.95 2.15 3.6-.16.44-.25.91-.25 1.4 0 2.21 1.79 4 4 4 .49 0 .96-.08 1.4-.24.65 1.27 2.02 2.14 3.6 2.14 1.58 0 2.95-.87 3.6-2.14.44.16.91.24 1.4.24 2.21 0 4-1.79 4-4 0-.49-.08-.96-.24-1.4 1.27-.65 2.14-2.02 2.14-3.6z"/>
          <path d="M10.2 16.2l-3.5-3.5 1.4-1.4 2.1 2.1 5.9-5.9 1.4 1.4-7.3 7.3z" fill="#000000"/>
        </svg>
      `;
    }

    // جلب البنوك من Supabase
    async function loadBanksFromSupabase() {
      try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/banks?status=eq.active&order=created_at.desc&select=*`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        const rows = await resp.json();

        if (Array.isArray(rows) && rows.length > 0) {
          allBanks = rows.map(b => ({
            id: b.id,
            name: b.name,
            slug: b.slug || b.id,
            city: b.city || b.address || "اليمن",
            description: b.description || b.short_description || "خدمات مصرفية ومالية إسلامية رائدة في اليمن.",
            logo_url: b.logo_url || "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Tadhamon_Bank_Logo.png/640px-Tadhamon_Bank_Logo.png",
            badge_type: b.badge_type || "gold",
            verified: b.verified !== false,
            phone: b.phone || "+9671503888",
            website: b.website || b.website_url || "https://yemen-rating.vercel.app",
            avg_rating: b.slug === 'kuraimi' ? '4.8' : '4.5',
            reviews_count: b.slug === 'kuraimi' ? '68' : '47'
          }));
        } else {
          allBanks = FALLBACK_BANKS;
        }
      } catch (err) {
        console.warn("Using fallback banks directory:", err);
        allBanks = FALLBACK_BANKS;
      }

      renderBanksGrid();
    }

    // رسم كروت البنوك
    function renderBanksGrid() {
      const container = document.getElementById('banks-grid');
      const badgeCount = document.getElementById('banks-count-badge');

      // تطبيق الفلترة والبحث
      const filtered = allBanks.filter(b => {
        const matchesSearch = b.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              b.description.toLowerCase().includes(searchQuery.toLowerCase());
        
        let matchesFilter = true;
        if (currentFilter === 'verified') {
          matchesFilter = b.verified === true;
        } else if (currentFilter !== 'all') {
          matchesFilter = (b.city && b.city.toLowerCase().includes(currentFilter.toLowerCase()));
        }

        return matchesSearch && matchesFilter;
      });

      badgeCount.innerText = `${filtered.length} بنوك مسجلة`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-14 bg-[#0D0D0D] border border-zinc-800 rounded-2xl p-6">
            <i class="fa-solid fa-building-columns text-zinc-600 text-3xl mb-2"></i>
            <h3 class="text-sm font-bold text-white">لا توجد بنوك مطابقة للبحث</h3>
            <p class="text-xs text-zinc-400 mt-1">جرّب البحث باسم آخر أو اختيار فلترة "الكل".</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(bank => `
        <article class="bg-[#0D0D0D] border border-zinc-800 hover:border-brand-gold/60 rounded-2xl p-4 transition duration-300 shadow-xl flex flex-col justify-between group">
          
          <!-- القسم العلوي: الشعار + الاسم والشارة + المدينة -->
          <div>
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-center gap-3">
                <!-- الشعار -->
                <div class="w-14 h-14 rounded-xl bg-white p-1.5 shadow-md flex items-center justify-center shrink-0 border border-zinc-700">
                  <img src="${bank.logo_url}" alt="${bank.name}" class="w-full h-full object-contain" onerror="this.src='https://images.unsplash.com/photo-1616077168079-7e09a677fb2c?w=100'" />
                </div>

                <!-- الاسم والشارة -->
                <div class="text-right">
                  <div class="flex items-center gap-1.5">
                    <h3 class="text-sm sm:text-base font-bold text-white group-hover:text-brand-gold transition leading-tight">
                      ${bank.name}
                    </h3>
                    ${renderBadge(bank.badge_type)}
                  </div>
                  
                  <!-- المدينة والتقييم السريع -->
                  <div class="flex items-center gap-2 text-[11px] text-zinc-400 mt-1">
                    <span class="flex items-center gap-1">
                      <i class="fa-solid fa-location-dot text-brand-gold text-[10px]"></i>
                      <span>${bank.city}</span>
                    </span>
                    <span>•</span>
                    <span class="flex items-center gap-1 text-brand-gold font-bold">
                      <i class="fa-solid fa-star text-[10px]"></i>
                      <span class="text-white">${bank.avg_rating}</span>
                      <span class="text-zinc-500 font-normal">(${bank.reviews_count})</span>
                    </span>
                  </div>
                </div>
              </div>

              <!-- أزرار اتصال سريعة -->
              <div class="flex items-center gap-1.5 shrink-0">
                <a href="tel:${bank.phone}" class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 text-brand-gold flex items-center justify-center text-xs hover:bg-zinc-800 transition" title="اتصال مباشر">
                  <i class="fa-solid fa-phone text-[10px]"></i>
                </a>
                <a href="${bank.website}" target="_blank" class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 text-blue-400 flex items-center justify-center text-xs hover:bg-zinc-800 transition" title="الموقع الإلكتروني">
                  <i class="fa-solid fa-globe text-[10px]"></i>
                </a>
              </div>
            </div>

            <!-- الوصف المختصر -->
            <p class="text-zinc-400 text-xs mt-3 leading-relaxed line-clamp-2">
              ${bank.description}
            </p>
          </div>

          <!-- الزر الذهبي للذهاب لصفحة البنك المحددة -->
          <div class="pt-4 border-t border-zinc-900 mt-3 flex items-center justify-between">
            <span class="text-[10px] text-zinc-500">حساب معتمد وموثق</span>
            
            <a
              href="bank.html?slug=${bank.slug}"
              class="inline-flex items-center gap-1.5 bg-brand-gold hover:bg-brand-goldHover text-black text-xs font-black px-4 py-2 rounded-xl shadow transition active:scale-95 cursor-pointer"
            >
              <span>زيارة صفحة البنك</span>
              <i class="fa-solid fa-arrow-left text-[11px]"></i>
            </a>
          </div>

        </article>
      `).join('');
    }

    // دوال البحث والفلترة
    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim();
      renderBanksGrid();
    }

    function setFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('filter-btn-active'));
      if (btn) btn.classList.add('filter-btn-active');
      renderBanksGrid();
    }

    window.addEventListener('DOMContentLoaded', loadBanksFromSupabase);
  </script>

</body>
</html>
