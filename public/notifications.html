<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مركز الإشعارات والتعميمات | يمن ريتغ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-black: #000000;
      --bg-card: #121217;
      --bg-card-inner: #181822;
      --bg-input: #15151C;
      
      --gold: #FFB800;
      --gold-hover: #E5A600;
      --gold-dim: rgba(255, 184, 0, 0.14);
      --gold-border: rgba(255, 184, 0, 0.35);
      
      --text: #FFFFFF;
      --text-gray: #8E8E98;
      --text-muted: #5E5E6A;
      
      --border: #20202A;
      --green: #10B981;
      --green-dim: rgba(16, 185, 129, 0.15);
      --blue: #3B82F6;
      --blue-dim: rgba(59, 130, 246, 0.15);
      --red: #EF4444;
      --red-dim: rgba(239, 68, 68, 0.15);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-black); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    .svg-icon { display: inline-block; width: 1.15em; height: 1.15em; fill: currentColor; vertical-align: -0.15em; flex-shrink: 0; }

    /* الهيدر */
    .notif-header {
      height: 60px; background: #000; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem;
      position: sticky; top: 0; z-index: 1000;
    }
    .notif-header h1 { font-size: 1.05rem; font-weight: 900; color: #FFF; display: flex; align-items: center; gap: 8px; }
    .notif-header h1 i { color: var(--gold); }

    .notif-container { padding: 1.25rem; max-width: 800px; margin: 0 auto; width: 100%; flex: 1; margin-bottom: 75px; }

    /* شريط العنوان وزر تعيين الكل كمقروء */
    .notif-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .btn-mark-read {
      background: none; border: 1px solid var(--gold-border); color: var(--gold);
      padding: 4px 12px; border-radius: 8px; font-size: 0.72rem; font-weight: 800; cursor: pointer; transition: 0.2s;
    }
    .btn-mark-read:hover { background: var(--gold); color: #000; }

    /* شريط التبويبات والفلترة */
    .notif-filter-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 1.25rem; }
    .notif-pill-btn {
      padding: 0.35rem 0.9rem; border-radius: 14px; font-size: 0.75rem; font-weight: 800;
      background: var(--bg-card); color: var(--text-gray); border: 1px solid var(--border);
      cursor: pointer; white-space: nowrap; transition: 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .notif-pill-btn:hover { color: #FFF; border-color: var(--gold-border); }
    .notif-pill-btn.active { background: var(--gold); color: #000; font-weight: 900; border-color: var(--gold); }
    .notif-pill-btn.active i { color: #000; }

    /* كروت الإشعارات الفاخرة */
    .notification-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 1.15rem; margin-bottom: 0.85rem; display: flex; gap: 12px; align-items: flex-start;
      transition: 0.2s; position: relative;
    }
    .notification-card.unread { border-color: var(--gold-border); background: #15151C; }
    .notification-card:hover { border-color: var(--gold); transform: translateY(-1px); }

    .notif-icon-box {
      width: 42px; height: 42px; border-radius: 12px; display: flex;
      align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0;
    }
    .icon-gold { background: var(--gold-dim); color: var(--gold); }
    .icon-green { background: var(--green-dim); color: var(--green); }
    .icon-blue { background: var(--blue-dim); color: var(--blue); }

    .notif-body { flex: 1; min-width: 0; }
    .notif-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .notif-title-text { font-size: 0.88rem; font-weight: 900; color: #FFF; line-height: 1.2; }
    .notif-time-ago { font-size: 0.68rem; color: var(--text-muted); font-weight: 700; white-space: nowrap; margin-right: 8px; }

    .notif-message-text { font-size: 0.78rem; color: var(--text-gray); line-height: 1.6; margin-bottom: 8px; }
    
    .notif-action-btn {
      background: var(--bg-card-inner); border: 1px solid var(--border); color: #FFF;
      padding: 4px 12px; border-radius: 6px; font-size: 0.72rem; font-weight: 800; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none; transition: 0.2s;
    }
    .notif-action-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }

    .unread-indicator-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
      position: absolute; top: 14px; left: 14px; box-shadow: 0 0 8px var(--gold);
    }

    /* شريط التنقل السفلي */
    .bottom-app-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #0A0A0D;
      border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000;
    }
    .bottom-nav-link { background: none; border: none; color: var(--text-gray); font-size: 0.68rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-decoration: none; }
    .bottom-nav-link i { font-size: 1.15rem; }
    .bottom-nav-link.active { color: var(--gold); font-weight: 900; }

    .toast-popup {
      position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); background: var(--gold);
      color: #000; padding: 8px 22px; border-radius: 20px; font-weight: 900; font-size: 0.8rem;
      z-index: 3000; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header class="notif-header">
    <div style="cursor: pointer;" onclick="window.location.href='/'" title="الرئيسية">
      <i class="fa-solid fa-house" style="color: #FFF;"></i>
    </div>
    <h1>
      <i class="fa-solid fa-bell"></i>
      <span>مركز الإشعارات والتعميمات</span>
    </h1>
    <div style="cursor: pointer;" onclick="window.location.href='/admin.html'" title="لوحة الإدارة">
      <i class="fa-solid fa-shield-halved" style="color: var(--gold);"></i>
    </div>
  </header>

  <main class="notif-container">

    <!-- شريط الترويسة وزر تعيين الكل كمقروء -->
    <div class="notif-top-bar">
      <span style="font-size: 0.85rem; font-weight: 900; color: #FFF;">تنبيهات النظام والمنشآت</span>
      <button class="btn-mark-read" onclick="markAllAsRead()">
        <i class="fa-solid fa-check-double"></i>
        <span>تعيين الكل كمقروء</span>
      </button>
    </div>

    <!-- فلتر التبويبات -->
    <div class="notif-filter-strip">
      <button class="notif-pill-btn active" onclick="filterNotifs('all', this)"><i class="fa-solid fa-layer-group"></i> <span>جميع الإشعارات</span></button>
      <button class="notif-pill-btn" onclick="filterNotifs('broadcast', this)"><i class="fa-solid fa-bullhorn"></i> <span>التعميمات الرسمية</span></button>
      <button class="notif-pill-btn" onclick="filterNotifs('verification', this)"><i class="fa-solid fa-certificate"></i> <span>التوثيق والأنشطة</span></button>
      <button class="notif-pill-btn" onclick="filterNotifs('review', this)"><i class="fa-solid fa-star"></i> <span>التقييمات والوظائف</span></button>
    </div>

    <!-- قائمة الإشعارات الحية -->
    <div id="notificationsFeedList"></div>

  </main>

  <!-- شريط التنقل السفلي -->
  <nav class="bottom-app-nav">
    <a href="/" class="bottom-nav-link">
      <i class="fa-solid fa-house"></i>
      <span>الرئيسية</span>
    </a>
    <a href="/offers.html" class="bottom-nav-link">
      <i class="fa-solid fa-tags"></i>
      <span>العروض</span>
    </a>
    <a href="/jobs.html" class="bottom-nav-link">
      <i class="fa-solid fa-briefcase"></i>
      <span>الوظائف</span>
    </a>
    <a href="/notifications.html" class="bottom-nav-link active">
      <i class="fa-solid fa-bell"></i>
      <span>الإشعارات</span>
    </a>
    <a href="/owner.html" class="bottom-nav-link">
      <i class="fa-solid fa-user-tie"></i>
      <span>لوحة المالك</span>
    </a>
  </nav>

  <div id="toastPopup" class="toast-popup"></div>

  <script>
    let notificationsData = [
      {
        id: 'n1',
        title: 'تعميم رسمي لجميع البنوك والمصارف',
        message: 'يرجى من جميع البنوك والمؤسسات المالية المعتمدة تحديث أسعار الصرف الصباحية والمسائية وتأكيد أرقام خدمة العملاء.',
        type: 'broadcast',
        is_read: false,
        time_ago: 'منذ 10 دقائق',
        action_url: '/financials.html',
        action_label: 'تحديث أسعار الصرف'
      },
      {
        id: 'n2',
        title: 'تم اعتماد وتوثيق منشأتك بالشارة الذهبية',
        message: 'تهانينا! تمت مراجعة مستندات (بنك الكريمي) ومنحه الشارة الذهبية الرسمية YR 97 في دليل المنصة.',
        type: 'verification',
        is_read: false,
        time_ago: 'منذ نصف ساعة',
        action_url: '/owner.html',
        action_label: 'عرض لوحة النشاط'
      },
      {
        id: 'n3',
        title: 'تقييم جديد 5 نجوم لمطعم حضرموت الدولي',
        message: 'قام العميل (أبو محمد) بنشر مراجعة جديدة وتقييم 5 نجوم لفرع صنعاء حدة.',
        type: 'review',
        is_read: true,
        time_ago: 'منذ ساعتين',
        action_url: '/owner.html',
        action_label: 'الرد على التقييم'
      },
      {
        id: 'n4',
        title: 'طلب توظيف ومطابقة ذكية بنسبة 87%',
        message: 'تم استلام طلب متقدم جديد لوظيفة (محاسب مالي أول) متوافق مع متطلبات الوظيفة عبر وساطة يمن ريتغ.',
        type: 'review',
        is_read: true,
        time_ago: 'منذ 4 ساعات',
        action_url: '/jobs.html',
        action_label: 'فحص الطلب'
      }
    ];

    function renderNotifications(list) {
      const container = document.getElementById('notificationsFeedList');
      if (!container) return;

      container.innerHTML = list.map(item => {
        let iconHtml = '<i class="fa-solid fa-bullhorn"></i>';
        let iconClass = 'icon-gold';
        if (item.type === 'verification') { iconHtml = '<i class="fa-solid fa-certificate"></i>'; iconClass = 'icon-green'; }
        if (item.type === 'review') { iconHtml = '<i class="fa-solid fa-star"></i>'; iconClass = 'icon-gold'; }
        if (item.type === 'job') { iconHtml = '<i class="fa-solid fa-briefcase"></i>'; iconClass = 'icon-blue'; }

        return `
          <div class="notification-card ${!item.is_read ? 'unread' : ''}">
            ${!item.is_read ? '<span class="unread-indicator-dot"></span>' : ''}
            
            <div class="notif-icon-box ${iconClass}">
              ${iconHtml}
            </div>

            <div class="notif-body">
              <div class="notif-title-row">
                <div class="notif-title-text">${item.title}</div>
                <div class="notif-time-ago">${item.time_ago}</div>
              </div>

              <p class="notif-message-text">${item.message}</p>

              ${item.action_url ? `
                <a href="${item.action_url}" class="notif-action-btn">
                  <span>${item.action_label || 'عرض التفاصيل'}</span>
                  <i class="fa-solid fa-arrow-left" style="font-size:0.65rem;"></i>
                </a>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function filterNotifs(type, btn) {
      document.querySelectorAll('.notif-pill-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      if (type === 'all') {
        renderNotifications(notificationsData);
      } else {
        renderNotifications(notificationsData.filter(n => n.type === type));
      }
    }

    function markAllAsRead() {
      notificationsData.forEach(n => n.is_read = true);
      renderNotifications(notificationsData);
      showToast('✅ تم تحديد جميع الإشعارات كمقروءة');
    }

    function showToast(msg) {
      const t = document.getElementById('toastPopup');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderNotifications(notificationsData);
    });
  </script>
</body>
</html>
