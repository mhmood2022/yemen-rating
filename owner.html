<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>لوحة المالك | يمن ريتنغ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5C400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/js/all.min.js" defer></script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/yemen-rating.css">
<style>
.container{max-width:1100px;margin:0 auto;padding:0 16px}
.site-header{background:var(--navy-900);border-bottom:1px solid var(--border);padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand-mark{width:36px;height:36px;background:var(--gold-gradient);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--navy-950);font-size:1.1rem;font-weight:900}
.dash-hero{background:radial-gradient(circle at center top,var(--navy-800),var(--navy-950));padding:26px 0;border-bottom:1px solid var(--border);text-align:center}
.dash-hero h1{color:var(--gold-400);font-size:1.3rem;margin:0 0 4px 0}
.box{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin:20px 0}
.box h3{color:var(--gold-400);font-size:1.1rem;margin:0 0 14px 0;display:flex;align-items:center;gap:8px}
.form-group{margin-bottom:12px;text-align:right}
.form-group label{display:block;font-size:0.82rem;color:var(--text-muted);margin-bottom:5px;font-weight:600}
.form-control{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--navy-950);color:#fff;font-size:0.9rem;min-height:44px;outline:none}
.btn{min-height:42px;padding:0 16px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:0.88rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn-gold{background:var(--gold-gradient);color:var(--navy-950)}
</style>
</head>
<body>
<header class="site-header">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="index.html" class="brand"><div class="brand-mark"><i class="fa-solid fa-star"></i></div><strong>لوحة تحكم المنشأة</strong></a>
        <a href="index.html" onclick="localStorage.removeItem('yr_session')" style="color:var(--danger);font-size:0.85rem;font-weight:700;text-decoration:none;"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</a>
    </div>
</header>
<section class="dash-hero">
    <div class="container">
        <h1><i class="fa-solid fa-briefcase"></i> لوحة إدارة منشأتك</h1>
        <p style="color:var(--text-muted);font-size:0.84rem;margin:0;">أضف بيانات منشأتك والوظائف المتاحة للمراجعة والاعتماد</p>
    </div>
</section>
<div class="container">
    <div class="box">
        <h3><i class="fa-solid fa-plus-circle"></i> إضافة أو تحديث بيانات المنشأة</h3>
        <form onsubmit="saveEnt(event)">
            <div class="form-group"><label>اسم المنشأة التجاري *</label><input class="form-control" id="eName" required placeholder="مثال: شركة النجم للتجارة"></div>
            <div class="form-group"><label>المدينة *</label><input class="form-control" id="eCity" required placeholder="صنعاء"></div>
            <div class="form-group"><label>رقم الهاتف المباشر *</label><input class="form-control" id="ePhone" required placeholder="770000000"></div>
            <div class="form-group"><label>وصف ونشاط المنشأة *</label><textarea class="form-control" id="eDesc" rows="3" required placeholder="اكتب نبذة عن نشاط الشركة وخدماتها..."></textarea></div>
            <button type="submit" class="btn btn-gold" style="width:100%;"><i class="fa-solid fa-save"></i> حفظ وإرسال للاعتماد</button>
        </form>
    </div>
</div>
<script>
function saveEnt(e){
    e.preventDefault();
    alert('تم استلام بيانات منشأتك بنجاح! سيتم مراجعتها وتفعيلها من قبل الإدارة فوراً.');
}
</script>
</body>
</html>
