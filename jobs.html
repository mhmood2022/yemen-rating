<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>الوظائف الشاغرة | يمن ريتنغ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5C400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/js/all.min.js" defer></script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/yemen-rating.css">
<style>
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.site-header{background:var(--navy-900);border-bottom:1px solid var(--border);padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand-mark{width:38px;height:38px;background:var(--gold-gradient);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--navy-950);font-size:1.1rem;font-weight:900}
.page-hero{background:radial-gradient(circle at center top,var(--navy-800),var(--navy-950));padding:35px 0 25px;text-align:center;border-bottom:1px solid var(--border)}
.page-hero h1{color:var(--gold-400);font-size:clamp(1.3rem,3vw,1.8rem);font-weight:800;margin:0 0 6px 0}
.jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin:24px 0 30px}
.job-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:var(--transition)}
.job-card:hover{border-color:var(--gold-500);transform:translateY(-3px)}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:0.85rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn-gold{background:var(--gold-gradient);color:var(--navy-950);width:100%}
.modal-overlay{position:fixed;inset:0;background:rgba(4,13,26,0.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px}
.modal-card{background:var(--navy-900);border:1px solid var(--gold-500);border-radius:12px;padding:22px;width:100%;max-width:480px}
.form-control{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--navy-950);color:#fff;font-size:0.9rem;outline:none;margin-bottom:10px}
</style>
</head>
<body>
<header class="site-header">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="index.html" class="brand"><div class="brand-mark"><i class="fa-solid fa-star"></i></div><strong>YEMEN RATING</strong></a>
        <a href="index.html" class="btn btn-gold" style="width:auto;min-height:36px;padding:0 12px;font-size:0.8rem;"><i class="fa-solid fa-house"></i> الرئيسية</a>
    </div>
</header>
<section class="page-hero">
    <div class="container">
        <h1><i class="fa-solid fa-briefcase"></i> أحدث الوظائف الشاغرة</h1>
        <p>تصفح الفرص الوظيفية وقدّم سيرتك الذاتية بأمان وموثوقية</p>
    </div>
</section>
<div class="container">
    <div class="jobs-grid" id="jobsGrid"></div>
</div>
<div class="modal-overlay" id="applyModal">
    <div class="modal-card">
        <h3 style="color:var(--gold-400);margin:0 0 14px 0;"><i class="fa-solid fa-paper-plane"></i> التقديم على الوظيفة</h3>
        <input class="form-control" id="appName" placeholder="الاسم الكامل">
        <input class="form-control" id="appPhone" placeholder="رقم الهاتف">
        <input class="form-control" id="appCv" placeholder="رابط السيرة الذاتية (Google Drive / LinkedIn)">
        <button class="btn btn-gold" onclick="submitApp()"><i class="fa-solid fa-check"></i> إرسال الطلب</button>
        <button class="btn btn-outline" style="margin-top:8px;width:100%;" onclick="closeModal()">إلغاء</button>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/db.js"></script>
<script src="js/sb-sync.js"></script>
<script>
const DEMO_JOBS=[
{id:'job1',title:'مطور تطبيقات Flutter',city:'صنعاء',salary:'400,000 ريال',type:'دوام كامل',desc:'مطلوب مطور تطبيقات خبير للعمل على مشاريع تجارية.'},
{id:'job2',title:'محاسب مالي معتمد',city:'عدن',salary:'250,000 ريال',type:'دوام كامل',desc:'إعداد التقارير والقوائم المالية ومراجعة القيود.'},
{id:'job3',title:'مصمم جرافيك وتجربة مستخدم',city:'عن بُعد',salary:'محدد حسب الخبرة',type:'عن بُعد',desc:'تصميم واجهات وتطبيقات احترافية بهوية متناسقة.'}
];
function renderJobs(){
    const list=(window.YR_DB&&YR_DB.get('jobs'))||DEMO_JOBS;
    document.getElementById('jobsGrid').innerHTML=list.map(j=>`
    <div class="job-card">
        <strong style="font-size:1.05rem;color:#fff;">${j.title}</strong>
        <div style="font-size:0.8rem;color:var(--text-muted);"><i class="fa-solid fa-location-dot" style="color:var(--gold-500);"></i> ${j.city||'اليمن'} • ${j.type||'دوام كامل'}</div>
        <p style="font-size:0.84rem;color:var(--text-muted);margin:0;line-height:1.4;">${j.description||j.desc||'فرصة وظيفية مميزة برواتب وبدلات مجزية.'}</p>
        <div style="font-size:0.85rem;color:var(--gold-400);font-weight:700;">${j.salary||'راتب تنافسي'}</div>
        <button class="btn btn-gold" onclick="openApply('${j.id}')"><i class="fa-solid fa-paper-plane"></i> تقديم طلب فوري</button>
    </div>`).join('');
}
function openApply(id){document.getElementById('applyModal').style.display='flex'}
function closeModal(){document.getElementById('applyModal').style.display='none'}
function submitApp(){
    const name=document.getElementById('appName').value.trim();
    if(!name){alert('الرجاء إدخال اسمك الكريم');return;}
    alert('شكراً لك! تم إرسال طلب التوظيف بنجاح.');
    closeModal();
}
document.addEventListener('DOMContentLoaded',renderJobs);
</script>
</body>
</html>
