<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>العروض والخصومات الحصرية | يمن ريتغ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-black: #000000;
      --bg-card: #121217;
      --bg-card-inner: #181822;
      --bg-input: #15151C;
      
      --gold: #FFB800;
      --gold-hover: #E5A600;
      --gold-dim: rgba(255, 184, 0, 0.14);
      --gold-border: rgba(255, 184, 0, 0.35);
      
      --text: #FFFFFF;
      --text-gray: #8E8E98;
      --text-muted: #5E5E6A;
      
      --border: #20202A;
      --red: #DC2626;
      --red-dim: rgba(220, 38, 38, 0.18);
      --green: #10B981;
      --green-dim: rgba(16, 185, 129, 0.15);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-black); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* شارة التوثيق المسننة الرسمية */
    .official-badge-svg { width: 16px; height: 16px; display: inline-block; vertical-align: middle; margin-right: 4px; flex-shrink: 0; }

    /* الهيدر */
    .offers-header {
      height: 60px; background: #000; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem;
      position: sticky; top: 0; z-index: 1000;
    }
    .offers-header h1 { font-size: 1.05rem; font-weight: 900; color: #FFF; display: flex; align-items: center; gap: 8px; }
    .offers-header h1 i { color: var(--gold); }

    .offers-container { padding: 1.25rem; max-width: 800px; margin: 0 auto; width: 100%; flex: 1; margin-bottom: 75px; }

    /* البانر الترويجي للعروض */
    .offers-hero-banner {
      background: linear-gradient(135deg, rgba(255, 184, 0, 0.18), rgba(220, 38, 38, 0.08)), url('https://images.unsplash.com/photo-1541888946425-d0fbb18086f6?w=800') center/cover;
      border: 1px solid var(--gold-border); border-radius: var(--radius-lg); padding: 1.4rem;
      display: flex; flex-direction: column; justify-content: space-between; min-height: 140px; margin-bottom: 1.5rem; position: relative;
    }
    .offers-hero-title { font-size: 1.2rem; font-weight: 900; color: #FFF; line-height: 1.2; }
    .offers-hero-sub { font-size: 0.75rem; color: #FFF; opacity: 0.9; margin-top: 4px; max-width: 80%; }

    /* شريط فلترة التصنيفات والمدن */
    .filter-pills-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 1.25rem; }
    .pill-filter-btn {
      padding: 0.35rem 0.9rem; border-radius: 14px; font-size: 0.75rem; font-weight: 800;
      background: var(--bg-card); color: var(--text-gray); border: 1px solid var(--border);
      cursor: pointer; white-space: nowrap; transition: 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .pill-filter-btn:hover { color: #FFF; border-color: var(--gold-border); }
    .pill-filter-btn.active { background: var(--gold); color: #000; font-weight: 900; border-color: var(--gold); }
    .pill-filter-btn.active i { color: #000; }

    /* كروت العروض والخصومات الفاخرة */
    .offer-card-item {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      overflow: hidden; margin-bottom: 1.25rem; transition: 0.2s;
    }
    .offer-card-item:hover { border-color: var(--gold); transform: translateY(-2px); }

    .offer-cover-box { height: 160px; background-size: cover; background-position: center; position: relative; }
    .discount-floating-pill {
      position: absolute; top: 12px; right: 12px; background: var(--red); color: #FFF;
      padding: 4px 12px; border-radius: 10px; font-size: 0.78rem; font-weight: 900; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
    }
    .expiry-floating-badge {
      position: absolute; bottom: 10px; left: 12px; background: rgba(0,0,0,0.85);
      border: 1px solid var(--border); padding: 3px 8px; border-radius: 8px; font-size: 0.68rem; color: var(--text-gray); font-weight: 700;
    }

    .offer-content-body { padding: 1.2rem; }
    .offer-biz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .offer-biz-info { display: flex; align-items: center; gap: 10px; }
    .offer-biz-logo { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); }
    .offer-biz-name { font-size: 0.88rem; font-weight: 900; color: #FFF; display: flex; align-items: center; gap: 4px; }

    .offer-title-text { font-size: 1rem; font-weight: 900; color: #FFF; margin-bottom: 4px; line-height: 1.3; }
    .offer-desc-text { font-size: 0.78rem; color: var(--text-gray); line-height: 1.6; margin-bottom: 1rem; }

    /* صندوق كود الخصم المفرغ (Dashed Coupon Box) */
    .coupon-code-action-box {
      background: var(--bg-card-inner); border: 1.5px dashed var(--gold); border-radius: var(--radius-md);
      padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem;
    }
    .coupon-code-val { font-family: monospace; font-size: 1rem; font-weight: 900; color: var(--gold); letter-spacing: 1px; }
    .btn-copy-code {
      background: var(--gold); color: #000; border: none; padding: 4px 12px; border-radius: 8px;
      font-size: 0.75rem; font-weight: 900; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 4px;
    }
    .btn-copy-code:hover { background: var(--gold-hover); }

    .offer-contact-strip { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
    .offer-btn-action {
      flex: 1; padding: 7px; border-radius: 8px; font-size: 0.75rem; font-weight: 800;
      background: var(--bg-card-inner); border: 1px solid var(--border); color: #FFF;
      display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; transition: 0.2s;
    }
    .offer-btn-action:hover { background: var(--gold); color: #000; border-color: var(--gold); }
    .offer-btn-action.wa:hover { background: #25D366; border-color: #25D366; color: #FFF; }

    /* شريط التنقل السفلي */
    .bottom-app-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #0A0A0D;
      border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000;
    }
    .bottom-nav-link { background: none; border: none; color: var(--text-gray); font-size: 0.68rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-decoration: none; }
    .bottom-nav-link i { font-size: 1.15rem; }
    .bottom-nav-link.active { color: var(--gold); font-weight: 900; }

    .toast-popup {
      position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); background: var(--gold);
      color: #000; padding: 8px 22px; border-radius: 20px; font-weight: 900; font-size: 0.8rem;
      z-index: 3000; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header class="offers-header">
    <div style="cursor: pointer;" onclick="window.location.href='/'" title="الرئيسية">
      <i class="fa-solid fa-house"></i>
    </div>
    <h1>
      <i class="fa-solid fa-tags"></i>
      <span>العروض والخصومات الحصرية</span>
    </h1>
    <div style="cursor: pointer;" onclick="window.location.href='/admin.html'" title="لوحة الإدارة">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
  </header>

  <main class="offers-container">

    <!-- البانر الترويجي -->
    <div class="offers-hero-banner">
      <div>
        <div class="offers-hero-title">أقوى عروض وتخفيضات اليمن</div>
        <div class="offers-hero-sub">وفر مع كوبونات وخصومات المنشآت والمتاجر المعتمدة في منصة يمن ريتغ.</div>
      </div>
      <div style="font-size: 0.72rem; color: var(--gold); font-weight: 800;">
        <i class="fa-solid fa-circle-check"></i> عروض حصرية وموثوقة
      </div>
    </div>

    <!-- فلتر التصنيفات -->
    <div class="filter-pills-strip">
      <button class="pill-filter-btn active" onclick="filterOffers('all', this)"><i class="fa-solid fa-layer-group"></i> <span>جميع العروض</span></button>
      <button class="pill-filter-btn" onclick="filterOffers('shops', this)"><i class="fa-solid fa-bag-shopping"></i> <span>متاجر وتسوق</span></button>
      <button class="pill-filter-btn" onclick="filterOffers('restaurants', this)"><i class="fa-solid fa-utensils"></i> <span>مطاعم ومقاهي</span></button>
      <button class="pill-filter-btn" onclick="filterOffers('hotels', this)"><i class="fa-solid fa-hotel"></i> <span>فنادق وإقامة</span></button>
    </div>

    <!-- قائمة العروض الحية -->
    <div id="offersFeedList"></div>

  </main>

  <!-- شريط التنقل السفلي -->
  <nav class="bottom-app-nav">
    <a href="/" class="bottom-nav-link">
      <i class="fa-solid fa-house"></i>
      <span>الرئيسية</span>
    </a>
    <a href="/offers.html" class="bottom-nav-link active">
      <i class="fa-solid fa-tags"></i>
      <span>العروض</span>
    </a>
    <a href="/jobs.html" class="bottom-nav-link">
      <i class="fa-solid fa-briefcase"></i>
      <span>الوظائف</span>
    </a>
    <a href="/properties.html" class="bottom-nav-link">
      <i class="fa-solid fa-city"></i>
      <span>العقارات</span>
    </a>
    <a href="/financials.html" class="bottom-nav-link">
      <i class="fa-solid fa-building-columns"></i>
      <span>المالية</span>
    </a>
  </nav>

  <div id="toastPopup" class="toast-popup"></div>

  <script>
    function getOfficialBadgeSVG(type) {
      let color = '#FFB800';
      if (type === 'blue') color = '#29A6FF';
      if (type === 'gray') color = '#8E8E93';
      
      return `
        <svg class="official-badge-svg" viewBox="0 0 24 24">
          <path fill="${color}" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.02-2.9-1.08-3.99s-2.6-1.54-3.99-1.08C14.32 2.28 13.08 1.4 11.65 1.4s-2.67.88-3.34 2.19c-1.39-.46-2.9-.02-3.99 1.08s-1.54 2.6-1.08 3.99C1.88 9.33 1 10.57 1 12s.88 2.67 2.19 3.34c-.46 1.39-.02 2.9 1.08 3.99s2.6 1.54 3.99 1.08c.67 1.31 1.91 2.19 3.34 2.19s2.67-.88 3.34-2.19c1.39.46 2.9.02 3.99-1.08s1.54-2.6 1.08-3.99c1.31-.67 2.19-1.91 2.19-3.34z"/>
          <path fill="#FFFFFF" d="M10.2 16.2l-3.5-3.5 1.4-1.4 2.1 2.1 5.3-5.3 1.4 1.4-6.7 6.7z"/>
        </svg>
      `;
    }

    const offersData = [
      {
        id: 'offer-1',
        bizName: 'متجر العصرية للجوالات',
        bizLogo: 'https://images.unsplash.com/photo-1578916171728-46686eac8d58?w=100',
        badge: 'gold',
        category: 'shops',
        city: 'صنعاء',
        phone: '778889990',
        wa: '967778889990',
        title: 'عروض متجر العصرية الكبرى للجوالات',
        desc: 'خصم 20% على جميع الهواتف الذكية والشواحن الأصلية مع ضمان سنة كاملة وسحب على جوائز فورية.',
        discount: 'خصم 20%',
        code: 'YR20',
        image: 'https://images.unsplash.com/photo-1534452203293-494d7ddbf7e0?w=600',
        expiry: 'ينتهي في: 30 سبتمبر 2026'
      },
      {
        id: 'offer-2',
        bizName: 'مطعم حضرموت الدولي',
        bizLogo: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=100',
        badge: 'gold',
        category: 'restaurants',
        city: 'صنعاء',
        phone: '771987654',
        wa: '967771987654',
        title: 'وجبات الغداء والمشويات العائلية الفاخرة',
        desc: 'استمتع بخصم 15% على المأكولات التراثية واللحوم الطازجة لجميع حاملي كود خصم يمن ريتغ.',
        discount: 'خصم 15%',
        code: 'HADRAMOUT15',
        image: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=600',
        expiry: 'ينتهي في: 15 أكتوبر 2026'
      },
      {
        id: 'offer-3',
        bizName: 'فندق تاج سبأ الدولي',
        bizLogo: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=100',
        badge: 'gold',
        category: 'hotels',
        city: 'تعز',
        phone: '772111222',
        wa: '96772111222',
        title: 'عرض الإقامة الفندقية للأجنحة الملكية',
        desc: 'خصم 25% على الحجوزات الفندقية لأكثر من 3 ليالٍ مع وجبة إفطار مجانية وخدمة استقبال المطار.',
        discount: 'خصم 25%',
        code: 'TAJ25',
        image: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600',
        expiry: 'ينتهي في: 20 سبتمبر 2026'
      }
    ];

    function renderOffers(list) {
      const container = document.getElementById('offersFeedList');
      if (!container) return;

      container.innerHTML = list.map(item => `
        <div class="offer-card-item">
          <div class="offer-cover-box" style="background-image: url('${item.image}');">
            <span class="discount-floating-pill">${item.discount}</span>
            <span class="expiry-floating-badge"><i class="fa-solid fa-clock"></i> ${item.expiry}</span>
          </div>

          <div class="offer-content-body">
            <div class="offer-biz-header">
              <div class="offer-biz-info">
                <img src="${item.bizLogo}" class="offer-biz-logo" alt="${item.bizName}">
                <div class="offer-biz-name">
                  <span>${item.bizName}</span>
                  ${getOfficialBadgeSVG(item.badge)}
                </div>
              </div>
              <span style="font-size:0.7rem; color:var(--text-gray); font-weight:700;"><i class="fa-solid fa-location-dot" style="color:var(--gold);"></i> ${item.city}</span>
            </div>

            <div class="offer-title-text">${item.title}</div>
            <p class="offer-desc-text">${item.desc}</p>

            <!-- صندوق كود الخصم المفرغ -->
            <div class="coupon-code-action-box">
              <div>
                <span style="font-size:0.7rem; color:var(--text-gray); display:block;">كود الخصم الحصري:</span>
                <span class="coupon-code-val">${item.code}</span>
              </div>
              <button onclick="copyCouponCode('${item.code}')" class="btn-copy-code">
                <i class="fa-solid fa-copy"></i>
                <span>نسخ الكود</span>
              </button>
            </div>

            <div class="offer-contact-strip">
              <a href="tel:${item.phone}" class="offer-btn-action"><i class="fa-solid fa-phone"></i> <span>اتصال</span></a>
              <a href="https://wa.me/${item.wa}?text=${encodeURIComponent('مرحباً، أود الاستفادة من العرض المعلن في يمن ريتغ بكود الخصم: ' + item.code)}" target="_blank" class="offer-btn-action wa" style="color:#25D366;"><i class="fa-brands fa-whatsapp"></i> <span>واتساب</span></a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterOffers(cat, btn) {
      document.querySelectorAll('.pill-filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      if (cat === 'all') {
        renderOffers(offersData);
      } else {
        renderOffers(offersData.filter(o => o.category === cat));
      }
    }

    function copyCouponCode(code) {
      navigator.clipboard.writeText(code);
      showToast(`🎉 تم نسخ كود الخصم: ${code}`);
    }

    function showToast(msg) {
      const t = document.getElementById('toastPopup');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderOffers(offersData);
    });
  </script>
</body>
</html>
