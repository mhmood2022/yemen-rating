<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لوحة النشاط | يمن ريتغ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-black: #000000;
      --bg-card: #121217;
      --bg-card-inner: #181822;
      --bg-input: #15151C;
      --gold: #FFB800;
      --gold-dim: rgba(255, 184, 0, 0.14);
      --gold-border: rgba(255, 184, 0, 0.35);
      --text: #FFFFFF;
      --text-gray: #8E8E93;
      --border: #20202A;
      --green: #10B981;
      --radius-md: 14px;
      --radius-lg: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-black); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    
    .svg-icon { display: inline-block; width: 1.15em; height: 1.15em; fill: currentColor; vertical-align: -0.15em; flex-shrink: 0; }
    .official-badge-svg { width: 17px; height: 17px; display: inline-block; vertical-align: middle; margin-right: 4px; flex-shrink: 0; }

    .owner-header {
      height: 60px; background: #000; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem;
      position: sticky; top: 0; z-index: 1000;
    }
    .main-content-wrap { padding: 1rem 1.1rem; max-width: 600px; margin: 0 auto; width: 100%; flex: 1; margin-bottom: 75px; }

    .owner-hero-banner {
      height: 140px; border-radius: var(--radius-lg);
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800') center/cover;
      position: relative; margin-bottom: 2.5rem; border: 1px solid var(--border);
    }
    .owner-logo-thumb {
      width: 62px; height: 62px; border-radius: 16px; border: 3px solid var(--bg-card); background: #000;
      position: absolute; bottom: -20px; right: 16px; object-fit: cover;
    }

    .owner-biz-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .owner-biz-name { font-size: 1.1rem; font-weight: 900; color: #FFF; display: flex; align-items: center; gap: 4px; }

    /* شريط نسبة اكتمال الملف المصحح */
    .profile-progress-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 0.9rem 1.1rem; margin-bottom: 1.25rem;
    }
    .progress-bar-line { height: 6px; background: #22222E; border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { height: 100%; background: var(--gold); border-radius: 3px; width: 86%; }

    /* المؤشرات الثلاثة */
    .stats-3-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.25rem; }
    .stat-metric-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 0.85rem 0.6rem; text-align: center;
    }
    .stat-metric-title { font-size: 0.72rem; color: var(--text-gray); font-weight: 700; margin-bottom: 4px; }
    .stat-metric-val { font-size: 1.3rem; font-weight: 900; color: #FFF; line-height: 1.1; }
    .stat-metric-growth { font-size: 0.68rem; font-weight: 800; color: var(--green); margin-top: 2px; }

    /* شبكة الأدوات الـ 8 */
    .tools-8-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.4rem; }
    .tool-tile-btn {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 0.85rem 0.2rem; text-align: center; cursor: pointer; transition: 0.2s;
    }
    .tool-tile-btn:hover { border-color: var(--gold); transform: translateY(-2px); }
    .tool-tile-icon {
      width: 36px; height: 36px; border-radius: 10px; background: var(--bg-card-inner);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; color: var(--gold);
    }
    .tool-tile-icon svg { width: 18px; height: 18px; fill: var(--gold); }
    .tool-tile-label { font-size: 0.68rem; font-weight: 800; color: var(--text); white-space: nowrap; }

    /* شريط التنقل السفلي */
    .bottom-app-nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: #0A0A0D;
      border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000;
    }
    .bottom-nav-link { background: none; border: none; color: var(--text-gray); font-size: 0.68rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-decoration: none; }
    .bottom-nav-link.active { color: var(--gold); font-weight: 900; }
    .bottom-center-add-fab {
      width: 48px; height: 48px; border-radius: 50%; background: var(--gold); color: #000;
      display: flex; align-items: center; justify-content: center; margin-top: -24px;
      box-shadow: 0 4px 18px rgba(255, 184, 0, 0.4); border: 3px solid #000; cursor: pointer;
    }
    .toast-popup { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 8px 20px; border-radius: 20px; font-weight: 900; font-size: 0.78rem; z-index: 3000; display: none; }
  </style>
</head>
<body>

  <header class="owner-header">
    <div style="cursor: pointer;" onclick="showToast('🔔 لديك 4 إشعارات جديدة')">
      <svg class="svg-icon" style="color: var(--gold); width: 20px; height: 20px;" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
    </div>
    <div style="font-weight: 900; font-size: 1.05rem; color: #FFF; display: flex; align-items: center; gap: 6px;">
      <span>لوحة النشاط</span>
      <svg style="width: 18px; height: 18px; fill: var(--gold);" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
    </div>
    <a href="/" style="color: #FFF; display: flex; align-items: center;">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
  </header>

  <main class="main-content-wrap">
    <div class="owner-hero-banner">
      <img src="https://images.unsplash.com/photo-1541888946425-d0fbb18086f6?w=200" class="owner-logo-thumb" alt="Logo">
    </div>

    <!-- ترويسة المنشأة (شارة ذهبية رسمية مفردة ملاصقة للاسم فقط) -->
    <div class="owner-biz-info">
      <div>
        <div class="owner-biz-name">
          <span>بنك الكريمي للتمويل الأصغر</span>
          <svg class="official-badge-svg" viewBox="0 0 24 24">
            <path fill="#FFB800" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.02-2.9-1.08-3.99s-2.6-1.54-3.99-1.08C14.32 2.28 13.08 1.4 11.65 1.4s-2.67.88-3.34 2.19c-1.39-.46-2.9-.02-3.99 1.08s-1.54 2.6-1.08 3.99C1.88 9.33 1 10.57 1 12s.88 2.67 2.19 3.34c-.46 1.39-.02 2.9 1.08 3.99s2.6 1.54 3.99 1.08c.67 1.31 1.91 2.19 3.34 2.19s2.67-.88 3.34-2.19c1.39.46 2.9.02 3.99-1.08s1.54-2.6 1.08-3.99c1.31-.67 2.19-1.91 2.19-3.34z"/>
            <path fill="#FFFFFF" d="M10.2 16.2l-3.5-3.5 1.4-1.4 2.1 2.1 5.3-5.3 1.4 1.4-6.7 6.7z"/>
          </svg>
        </div>
        <p style="font-size: 0.72rem; color: var(--text-gray); margin-top: 3px;">بنوك ومصارف • صنعاء / جميع المحافظات</p>
      </div>
    </div>

    <!-- شريط اكتمال الملف -->
    <div class="profile-progress-card">
      <div style="display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 800;">
        <span style="color: var(--text-gray);">نسبة اكتمال الملف التجاري</span>
        <span style="color: var(--gold);">86%</span>
      </div>
      <div class="progress-bar-line">
        <div class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- المؤشرات الـ 3 -->
    <div class="stats-3-grid">
      <div class="stat-metric-card">
        <div class="stat-metric-title">مشاهدات الملف</div>
        <div class="stat-metric-val">15,230</div>
        <div class="stat-metric-growth">+18%</div>
      </div>
      <div class="stat-metric-card">
        <div class="stat-metric-title">الاتصالات</div>
        <div class="stat-metric-val">245</div>
        <div class="stat-metric-growth">+15%</div>
      </div>
      <div class="stat-metric-card">
        <div class="stat-metric-title">طلبات الخدمات</div>
        <div class="stat-metric-val">89</div>
        <div class="stat-metric-growth">+20%</div>
      </div>
    </div>

    <div style="font-size: 0.95rem; font-weight: 900; color: #FFF; margin-bottom: 0.85rem;">إدارة نشاطك التجاري</div>

    <!-- شبكة الأدوات الـ 8 -->
    <div class="tools-8-grid">
      <div class="tool-tile-btn" onclick="showToast('🏢 جاري فتح تعديل المعلومات الأساسية')"><div class="tool-tile-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></div><div class="tool-tile-label">المعلومات</div></div>
      <div class="tool-tile-btn" onclick="showToast('📸 جاري فتح إدارة الصور والوسائط')"><div class="tool-tile-icon"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div><div class="tool-tile-label">الصور</div></div>
      <div class="tool-tile-btn" onclick="showToast('📍 جاري فتح قائمة الفروع')"><div class="tool-tile-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div><div class="tool-tile-label">الفروع</div></div>
      <div class="tool-tile-btn" onclick="showToast('🏷️ جاري فتح إدارة العروض والخصومات')"><div class="tool-tile-icon"><svg viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg></div><div class="tool-tile-label">العروض</div></div>
      <div class="tool-tile-btn" onclick="showToast('💼 جاري فتح إدارة شواغر التوظيف')"><div class="tool-tile-icon"><svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.1 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg></div><div class="tool-tile-label">الوظائف</div></div>
      <div class="tool-tile-btn" onclick="showToast('⭐ جاري فتح التقييمات ومراجعات العملاء')"><div class="tool-tile-icon"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></div><div class="tool-tile-label">التقييمات</div></div>
      <div class="tool-tile-btn" onclick="showToast('📊 جاري فتح إحصائيات النشاط')"><div class="tool-tile-icon"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg></div><div class="tool-tile-label">الإحصائيات</div></div>
      <div class="tool-tile-btn" onclick="showToast('💬 جاري فتح الرسائل والاستفسارات')"><div class="tool-tile-icon"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div><div class="tool-tile-label">الرسائل</div></div>
    </div>
  </main>

  <nav class="bottom-app-nav-bar">
    <a href="/" class="bottom-nav-link"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>الرئيسية</span></a>
    <a href="/financials.html" class="bottom-nav-link"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/></svg><span>المالية</span></a>
    <div class="bottom-center-add-fab" onclick="showToast('🏷️ فتح نافذة إضافة عرض جديد')"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
    <a href="/owner.html" class="bottom-nav-link active"><svg viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg><span>نشاطي</span></a>
    <a href="/admin.html" class="bottom-nav-link"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg><span>الإدارة</span></a>
  </nav>

  <div id="toastPopup" class="toast-popup"></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toastPopup');
      t.textContent = msg; t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }
  </script>
</body>
</html>
