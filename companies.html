<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>الشركات والمؤسسات | يمن ريتنغ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5C400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/js/all.min.js" defer></script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/yemen-rating.css">
<style>
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.site-header{background:var(--navy-900);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1000;padding:12px 0}
.header-inner{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand-mark{width:38px;height:38px;background:var(--gold-gradient);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--navy-950);font-size:1.1rem;font-weight:900}
.brand-text strong{color:var(--gold-400);font-size:1rem;display:block}
.page-hero{background:radial-gradient(circle at center top,var(--navy-800),var(--navy-950));padding:35px 0 25px;text-align:center;border-bottom:1px solid var(--border)}
.page-hero h1{color:var(--gold-400);font-size:clamp(1.3rem,3vw,1.8rem);font-weight:800;margin:0 0 6px 0}
.page-hero p{color:var(--text-muted);font-size:0.88rem;margin:0}
.filters-bar{background:var(--navy-900);border:1px solid var(--border);border-radius:10px;padding:12px;margin:20px 0;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.filters-bar input, .filters-bar select{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--navy-950);color:#fff;font-size:0.86rem;outline:none;min-height:44px}
.companies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:30px}
.comp-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:var(--transition);text-decoration:none;color:inherit}
.comp-card:hover{border-color:var(--gold-500);transform:translateY(-3px)}
.comp-top{display:flex;align-items:center;gap:12px}
.comp-logo{width:50px;height:50px;border-radius:10px;background:var(--navy-700);display:flex;align-items:center;justify-content:center;color:var(--gold-400);font-size:1.3rem;flex-shrink:0}
.comp-name{font-size:1rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge-v{background:rgba(16,185,129,0.15);color:var(--success);padding:2px 8px;border-radius:20px;font-size:0.65rem;font-weight:700}
.stars{color:var(--gold-400);font-size:0.8rem;letter-spacing:1px}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:0.85rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn-gold{background:var(--gold-gradient);color:var(--navy-950);width:100%}
.ad-slot{background:var(--navy-900);border:1px dashed var(--border);border-radius:8px;margin:20px auto;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.8rem;min-height:80px;width:100%}
@media(max-width:768px){.filters-bar{grid-template-columns:1fr 1fr}.filters-bar input{grid-column:1/-1}.companies-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand"><div class="brand-mark"><i class="fa-solid fa-star"></i></div><div class="brand-text"><strong>YEMEN RATING</strong><span>يمن ريتنغ</span></div></a>
        <div style="display:flex;gap:8px;align-items:center">
            <a href="index.html" class="btn btn-gold" style="min-height:36px;padding:0 12px;font-size:0.8rem;"><i class="fa-solid fa-house"></i> الرئيسية</a>
        </div>
    </div>
</header>
<section class="page-hero">
    <div class="container">
        <h1><i class="fa-solid fa-building"></i> دليل الشركات اليمنية</h1>
        <p>استكشف وقيّم كبرى المنشآت والشركات في اليمن</p>
    </div>
</section>
<div class="container">
    <div class="filters-bar">
        <input type="text" id="searchComp" placeholder="🔎 ابحث بالاسم أو النشاط..." oninput="renderComps()">
        <select id="cityFilter" onchange="renderComps()"><option value="">كل المدن</option><option value="صنعاء">صنعاء</option><option value="عدن">عدن</option><option value="تعز">تعز</option><option value="الحديدة">الحديدة</option><option value="المكلا">المكلا</option></select>
        <select id="catFilter" onchange="renderComps()"><option value="">كل التصنيفات</option><option value="تقنية">تقنية</option><option value="مقاولات">مقاولات</option><option value="تجارة">تجارة</option><option value="نقل">نقل</option></select>
        <select id="sortFilter" onchange="renderComps()"><option value="rating">الأعلى تقييماً</option><option value="newest">الأحدث</option></select>
    </div>
    <div class="ad-slot" data-placement="COMPANY_TOP">📢 مساحة إعلانية - أعلى صفحة الشركات</div>
    <div class="companies-grid" id="compGrid"></div>
    <div class="ad-slot" data-placement="COMPANY_BOTTOM">📢 مساحة إعلانية - أسفل صفحة الشركات</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Core Stack -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/db.js"></script>
    <script src="js/sb-sync.js"></script>
    <script src="js/matching.js"></script>
    <script src="js/ads-loader.js"></script>
<script src="js/sb-sync.js"></script>
<script src="js/ads-loader.js"></script>
<script>
const DEMO_COMPS=[
{id:'comp1',name:'شركة التقنية اليمنية',cat:'تقنية',city:'صنعاء',verified:true,rating:4.8,count:203,desc:'شركة رائدة في البرمجيات والحلول التقنية المتكاملة.',phone:'+967771234567'},
{id:'comp2',name:'مجموعة البناء الحديث',cat:'مقاولات',city:'عدن',verified:true,rating:4.3,count:89,desc:'مقاولات عامة وبناء متكامل بجودة عالية.',phone:'+967772345678'},
{id:'comp3',name:'شركة سبأ للأدوية',cat:'تجارة',city:'صنعاء',verified:false,rating:4.1,count:67,desc:'توريد وتوزيع الأدوية والمستلزمات الطبية.',phone:'+967773456789'},
{id:'comp4',name:'شركة عدن للنقل السريع',cat:'نقل',city:'عدن',verified:true,rating:4.5,count:120,desc:'خدمات النقل والشحن السريع داخل وخارج المدينة.',phone:'+967774567890'}
];
function stars(r){return '★'.repeat(Math.round(r||5))+'☆'.repeat(5-Math.round(r||5))}
function renderComps(){
    const q=document.getElementById('searchComp').value.trim();
    const city=document.getElementById('cityFilter').value;
    const cat=document.getElementById('catFilter').value;
    let list=(window.YR_DB&&YR_DB.get('companies'))||DEMO_COMPS;
    if(q) list=list.filter(x=>(x.name||'').includes(q)||(x.description||'').includes(q));
    if(city) list=list.filter(x=>(x.city||'').includes(city));
    if(cat) list=list.filter(x=>(x.category||x.cat||'').includes(cat));
    const grid=document.getElementById('compGrid');
    if(!list.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px;"><i class="fa-solid fa-building" style="font-size:2rem;color:var(--gold-500);display:block;margin-bottom:8px;"></i>لا توجد نتائج مطابقة</div>';return;}
    grid.innerHTML=list.map(x=>`
    <div class="comp-card">
        <div class="comp-top">
            <div class="comp-logo"><i class="fa-solid fa-building"></i></div>
            <div>
                <div class="comp-name">${x.name} ${x.verified?'<span class="badge-v"><i class="fa-solid fa-circle-check"></i> موثق</span>':''}</div>
                <div style="font-size:0.78rem;color:var(--text-muted);">${x.category||x.cat||'شركة'} • ${x.city||'اليمن'}</div>
            </div>
        </div>
        <div class="stars">${stars(x.rating||4.5)} <span style="color:#fff;font-size:0.8rem;">(${x.count||100} تقييم)</span></div>
        <p style="font-size:0.84rem;color:var(--text-muted);margin:0;line-height:1.4;">${x.description||x.desc||'منشأة معتمدة لدى منصة يمن ريتنغ'}</p>
        <a href="company.html?id=${x.id}" class="btn btn-gold"><i class="fa-solid fa-eye"></i> عرض الملف الكامل</a>
    </div>`).join('');
}
document.addEventListener('DOMContentLoaded',()=>renderComps());
</script>
</body>
</html>
