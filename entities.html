<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>دليل المنشآت والخدمات | يمن ريتنغ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5C400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/js/all.min.js" defer></script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/yemen-rating.css">
<style>
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.site-header{background:var(--navy-900);border-bottom:1px solid var(--border);padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand-mark{width:38px;height:38px;background:var(--gold-gradient);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--navy-950);font-size:1.1rem;font-weight:900}
.page-hero{background:radial-gradient(circle at center top,var(--navy-800),var(--navy-950));padding:35px 0 25px;text-align:center;border-bottom:1px solid var(--border)}
.ent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:24px 0 30px}
.ent-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:var(--transition);text-decoration:none;color:inherit}
.ent-card:hover{border-color:var(--gold-400);transform:translateY(-3px)}
.ent-logo{width:50px;height:50px;border-radius:10px;background:var(--navy-700);display:flex;align-items:center;justify-content:center;color:var(--gold-400);font-size:1.3rem}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:0.85rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;width:100%}
.btn-gold{background:var(--gold-gradient);color:var(--navy-950)}
</style>
</head>
<body>
<header class="site-header">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="index.html" class="brand"><div class="brand-mark"><i class="fa-solid fa-star"></i></div><strong>YEMEN RATING</strong></a>
        <a href="index.html" class="btn btn-gold" style="width:auto;min-height:36px;padding:0 12px;font-size:0.8rem;"><i class="fa-solid fa-house"></i> الرئيسية</a>
    </div>
</header>
<section class="page-hero">
    <div class="container">
        <h1 id="entPageTitle"><i class="fa-solid fa-store"></i> دليل المنشآت والخدمات</h1>
        <p id="entPageDesc">تصفح أفضل المحلات، الفنادق، المطاعم، وشركات النقل في اليمن</p>
    </div>
</section>
<div class="container">
    <div class="ent-grid" id="entGrid"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/db.js"></script>
<script src="js/sb-sync.js"></script>
<script>
const CONFIG={
    transport:{icon:'fa-truck-fast',title:'شركات النقل والشحن'},
    wallet:{icon:'fa-wallet',title:'المحافظ الإلكترونية'},
    hotel:{icon:'fa-hotel',title:'الفنادق والإقامة'},
    restaurant:{icon:'fa-utensils',title:'المطاعم والكافيهات'},
    shop:{icon:'fa-store',title:'المحلات والمراكز التجارية'},
    exchange:{icon:'fa-money-bill-transfer',title:'محلات وشركات الصرافة'}
};
function initEntities(){
    const type=new URLSearchParams(location.search).get('type')||'hotel';
    const cfg=CONFIG[type]||CONFIG.hotel;
    document.getElementById('entPageTitle').innerHTML=`<i class="fa-solid ${cfg.icon}"></i> ${cfg.title}`;
    const list=[
        {id:'1',name:'فندق قصر العرب',city:'صنعاء',desc:'إقامة فندقية فاخرة خمس نجوم',phone:'+9671222333'},
        {id:'2',name:'مطعم الشرق الأوسط',city:'عدن',desc:'أشهى المأكولات اليمنية والعربية',phone:'+9672444555'}
    ];
    document.getElementById('entGrid').innerHTML=list.map(x=>`
    <div class="ent-card">
        <div style="display:flex;align-items:center;gap:12px;">
            <div class="ent-logo"><i class="fa-solid ${cfg.icon}"></i></div>
            <div>
                <strong style="color:#fff;font-size:1rem;">${x.name}</strong>
                <div style="color:var(--text-muted);font-size:0.8rem;">${x.city}</div>
            </div>
        </div>
        <p style="color:var(--text-muted);font-size:0.84rem;margin:0;">${x.desc}</p>
        <a href="entity.html?type=${type}&id=${x.id}" class="btn btn-gold"><i class="fa-solid fa-eye"></i> عرض الملف الكامل</a>
    </div>`).join('');
}
document.addEventListener('DOMContentLoaded',initEntities);
</script>
</body>
</html>
