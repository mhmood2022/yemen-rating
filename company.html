<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ملف الشركة | يمن ريتنغ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5C400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/js/all.min.js" defer></script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/yemen-rating.css">
<style>
.container{max-width:1100px;margin:0 auto;padding:0 16px}
.site-header{background:var(--navy-900);border-bottom:1px solid var(--border);padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand-mark{width:36px;height:36px;background:var(--gold-gradient);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--navy-950);font-size:1.1rem;font-weight:900}
.cover{height:160px;background:linear-gradient(135deg,#0B1F3A,#07152A);border-bottom:3px solid var(--gold-500);position:relative;display:flex;align-items:flex-end;padding:16px}
.cover-logo{width:70px;height:70px;background:var(--gold-gradient);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--navy-950);font-size:1.8rem;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin:20px 0}
.box{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
.box h3{color:var(--gold-400);font-size:1.05rem;margin:0 0 12px 0;display:flex;align-items:center;gap:8px}
.btn{min-height:42px;padding:0 16px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:0.88rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;width:100%}
.btn-gold{background:var(--gold-gradient);color:var(--navy-950)}
.btn-wa{background:#25d366;color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:#fff}
.form-control{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--navy-950);color:#fff;font-size:0.9rem;outline:none;margin-bottom:10px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="index.html" class="brand"><div class="brand-mark"><i class="fa-solid fa-star"></i></div><strong>YEMEN RATING</strong></a>
        <a href="companies.html" class="btn btn-outline" style="width:auto;min-height:36px;"><i class="fa-solid fa-arrow-right"></i> رجوع للشركات</a>
    </div>
</header>
<div class="cover container"><div class="cover-logo"><i class="fa-solid fa-building"></i></div></div>
<div class="container">
    <h1 id="compName" style="font-size:1.5rem;color:#fff;margin:14px 0 6px 0;">جاري التحميل...</h1>
    <div id="compRating" style="color:var(--gold-400);margin-bottom:16px;">★★★★★</div>
    <div class="grid2">
        <div>
            <div class="box"><h3><i class="fa-solid fa-circle-info"></i> نبذة عن الشركة</h3><p id="compDesc" style="color:var(--text-muted);line-height:1.6;"></p></div>
            <div class="box"><h3><i class="fa-solid fa-star"></i> التقييمات وآراء العملاء</h3>
                <div id="revList"><p style="color:var(--text-muted);font-size:0.85rem;">لا توجد تقييمات مسبقة - كن أول من يقيم!</p></div>
                <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px;">
                    <h4 style="color:var(--gold-400);font-size:0.9rem;margin:0 0 10px 0;">أضف تقييمك الآن</h4>
                    <input class="form-control" id="revUser" placeholder="اسمك الكريم">
                    <textarea class="form-control" id="revText" rows="2" placeholder="اكتب تعليقك وتجربتك..."></textarea>
                    <button class="btn btn-gold" onclick="addReview()"><i class="fa-solid fa-paper-plane"></i> إرسال التقييم</button>
                </div>
            </div>
        </div>
        <div>
            <div class="box"><h3><i class="fa-solid fa-address-book"></i> التواصل المباشر</h3>
                <div style="display:flex;flex-direction:column;gap:8px;" id="compContact"></div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Core Stack -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/db.js"></script>
    <script src="js/sb-sync.js"></script>
    <script src="js/matching.js"></script>
    <script src="js/ads-loader.js"></script>
<script src="js/sb-sync.js"></script>
<script>
let curComp = null;
function loadComp(){
    const id=new URLSearchParams(location.search).get('id')||'comp1';
    curComp=(window.YR_DB&&YR_DB.findById('companies',id))||{name:'شركة التقنية اليمنية',description:'شركة رائدة في البرمجيات والحلول التقنية',phone:'+967771234567',city:'صنعاء'};
    document.title=curComp.name+' | يمن ريتنغ';
    document.getElementById('compName').innerHTML=curComp.name+' <span style="font-size:0.75rem;color:var(--success);"><i class="fa-solid fa-circle-check"></i> موثق</span>';
    document.getElementById('compDesc').textContent=curComp.description||'لا يوجد وصف متاح';
    document.getElementById('compContact').innerHTML=
        (curComp.phone?`<a href="tel:${curComp.phone}" class="btn btn-gold"><i class="fa-solid fa-phone"></i> اتصال: ${curComp.phone}</a>`:'')+
        `<a href="https://wa.me/967771234567" target="_blank" class="btn btn-wa"><i class="fa-brands fa-whatsapp"></i> تواصل عبر واتساب</a>`;
}
function addReview(){
    const name=document.getElementById('revUser').value.trim()||'زائر';
    const text=document.getElementById('revText').value.trim();
    if(!text){alert('الرجاء كتابة التعليق أولاً');return;}
    alert('شكراً لك يا '+name+'! تم استلام تقييمك وسيتم اعتماده.');
    document.getElementById('revText').value='';
}
document.addEventListener('DOMContentLoaded',loadComp);
</script>
</body>
</html>
