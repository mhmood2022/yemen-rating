<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>دليل البنوك والمصارف | يمن ريتنغ</title>

  <!-- خط Tajawal / Cairo الرسمي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#EAB308',         /* الأصفر الذهبي المعتمد */
              goldHover: '#CA8A04',
              dark: '#000000',
              card: '#0B0F17',
              cardBorder: '#1F2937'
            }
          },
          fontFamily: {
            cairo: ['Cairo', 'Tajawal', 'sans-serif'],
            tajawal: ['Tajawal', 'Cairo', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
/* إخفاء شريط التمرير الجانبي تماماً في كافة المتصفحات */
* {
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}
*::-webkit-scrollbar {
  display: none !important;
  width: 0px !important;
  height: 0px !important;
  background: transparent !important;
}
html, body {
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}
html::-webkit-scrollbar, body::-webkit-scrollbar {
  display: none !important;
  width: 0px !important;
  height: 0px !important;
  background: transparent !important;
}

    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-chip-active {
      background-color: #EAB308 !important;
      color: #000000 !important;
      font-weight: 800 !important;
      border-color: #EAB308 !important;
    }
  </style>
</head>

<body class="min-h-screen bg-black text-white flex justify-center selection:bg-brand-gold selection:text-black">

  <main class="w-full max-w-md md:max-w-4xl lg:max-w-6xl min-h-screen bg-black flex flex-col pb-20 px-4 md:px-8 select-none mx-auto">

    <!-- 1. رأس الصفحة النظيف -->
    <header class="py-4 border-b border-zinc-900 flex items-center justify-between">
      <a href="index.html" class="w-8 h-8 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 hover:text-brand-gold transition" title="الرئيسية">
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </a>

      <h1 class="text-base font-black text-white flex items-center gap-2">
        <i class="fa-solid fa-building-columns text-brand-gold"></i>
        <span>دليل البنوك والمصارف</span>
      </h1>

      <div class="w-8"></div>
    </header>

    <!-- 2. حقل البحث والفلترة -->
    <div class="pt-4 pb-2 space-y-2.5">
      <div class="relative w-full">
        <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3 text-zinc-500 text-xs"></i>
        <input
          type="text"
          id="search-input"
          oninput="handleSearch()"
          placeholder="ابحث عن بنك..."
          class="w-full bg-[#0B0F17] border border-zinc-800 rounded-xl py-2 pr-9 pl-4 text-xs text-white placeholder-zinc-500 outline-none focus:border-brand-gold transition text-right"
        />
      </div>

      <!-- شرائح الفلترة السريعة -->
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 text-xs">
        <button type="button" onclick="setCityFilter('all', this)" class="filter-chip filter-chip-active shrink-0 px-3 py-1.5 rounded-lg bg-[#0B0F17] border border-zinc-800 text-zinc-300 transition cursor-pointer text-[11px]">
          الكل
        </button>
        <button type="button" onclick="toggleVerifiedOnly(this)" id="filter-verified-btn" class="filter-chip shrink-0 px-3 py-1.5 rounded-lg bg-[#0B0F17] border border-zinc-800 text-zinc-300 hover:text-white transition flex items-center gap-1 cursor-pointer text-[11px]">
          <i class="fa-solid fa-circle-check text-emerald-400 text-[10px]"></i>
          <span>الموثقة فقط</span>
        </button>
        <button type="button" onclick="setCityFilter('صنعاء', this)" class="filter-chip shrink-0 px-3 py-1.5 rounded-lg bg-[#0B0F17] border border-zinc-800 text-zinc-300 hover:text-white transition cursor-pointer text-[11px]">
          صنعاء
        </button>
        <button type="button" onclick="setCityFilter('تعز', this)" class="filter-chip shrink-0 px-3 py-1.5 rounded-lg bg-[#0B0F17] border border-zinc-800 text-zinc-300 hover:text-white transition cursor-pointer text-[11px]">
          تعز
        </button>
      </div>
    </div>

    <!-- 3. شبكة بطاقات البنوك المضبوطة بدقة بالغة (من اليمين إلى اليسار) -->
    <section id="banks-grid" class="space-y-4 pt-2">
      <!-- الكروت تُحقن هنا -->
    </section>

    <!-- 4. نافذة طلب إثبات الملكية -->
    <div id="claim-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="closeClaimModal()">
      <div class="bg-[#0B0F17] border border-zinc-800 rounded-2xl w-full max-w-sm p-4 space-y-3 text-right shadow-2xl" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
          <h4 class="text-xs font-bold text-white flex items-center gap-1.5">
            <i class="fa-solid fa-shield-halved text-brand-gold"></i> طلب إثبات ملكية الصفحة
          </h4>
          <button type="button" onclick="closeClaimModal()" class="w-7 h-7 rounded-full bg-zinc-900 flex items-center justify-center text-zinc-400 hover:text-white cursor-pointer">
            <i class="fa-solid fa-xmark text-xs"></i>
          </button>
        </div>

        <p id="claim-bank-title" class="text-xs font-bold text-brand-gold bg-black/60 p-2 rounded-lg border border-zinc-800/80"></p>

        <form id="claim-form" onsubmit="submitClaimRequest(event)" class="space-y-2.5 text-xs">
          <input type="hidden" id="claim-bank-id" value="" />
          <div>
            <label class="block text-zinc-400 mb-1 text-[11px]">اسم المفوض / ممثل البنك*</label>
            <input type="text" id="claim-name" required placeholder="مثال: صالح المقطري" class="w-full bg-black border border-zinc-800 rounded-lg p-2 text-white outline-none focus:border-brand-gold text-xs text-right" />
          </div>
          <div>
            <label class="block text-zinc-400 mb-1 text-[11px]">الصفة أو المسمى الوظيفي*</label>
            <input type="text" id="claim-role" required placeholder="مثال: مدير العلاقات العامة / الممثل القانوني" class="w-full bg-black border border-zinc-800 rounded-lg p-2 text-white outline-none focus:border-brand-gold text-xs text-right" />
          </div>
          <div>
            <label class="block text-zinc-400 mb-1 text-[11px]">رقم الهاتف / الواتساب للتواصل*</label>
            <input type="tel" id="claim-phone" required placeholder="مثال: 777888999" class="w-full bg-black border border-zinc-800 rounded-lg p-2 text-white outline-none focus:border-brand-gold text-xs text-right" />
          </div>
          <div>
            <label class="block text-zinc-400 mb-1 text-[11px]">ملاحظات أو رقم السجل التجاري</label>
            <textarea id="claim-notes" rows="2" placeholder="اكتب رقم السجل أو ملاحظاتك..." class="w-full bg-black border border-zinc-800 rounded-lg p-2 text-white outline-none focus:border-brand-gold text-xs text-right"></textarea>
          </div>

          <div class="flex justify-end gap-2 pt-2 border-t border-zinc-800">
            <button type="button" onclick="closeClaimModal()" class="px-3 py-1.5 rounded-lg bg-zinc-900 text-zinc-400 hover:text-white cursor-pointer text-xs">إلغاء</button>
            <button type="submit" id="claim-submit-btn" class="px-4 py-1.5 rounded-lg bg-brand-gold hover:bg-brand-goldHover text-black font-bold cursor-pointer transition text-xs">إرسال الطلب</button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://wkdqeghotlipciqiytuj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrZHFlZ2hvdGxpcGNpcWl5dHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MDM4NzEsImV4cCI6MjEwMjQ3OTg3MX0.ahqq5okKMXMxuI-8sArjxcVIpPDRmX20mhscs8BaCTE';

    let banksList = [];
    let pendingClaimsSet = new Set();
    let selectedCity = 'all';
    let onlyVerified = false;
    let searchKeyword = '';

    // دالة شارة التوثيق الدائرية المعتمدة
    function renderVerifiedRosette(color) {
      return `
        <svg class="w-4 h-4 fill-current inline-block select-none shrink-0" style="color: ${color || '#1D9BF0'}" viewBox="0 0 24 24" title="موثق رسمياً">
          <path d="M22.5 12.5c0-1.58-.88-2.95-2.15-3.6.15-.44.24-.91.24-1.4 0-2.21-1.79-4-4-4-.49 0-.96.08-1.4.24C14.55 2.48 13.18 1.6 11.6 1.6c-1.58 0-2.95.88-3.6 2.15-.44-.16-.91-.25-1.4-.25-2.21 0-4 1.79-4 4 0 .49.08.96.24 1.4C1.58 9.55.7 10.92.7 12.5c0 1.58.88 2.95 2.15 3.6-.16.44-.25.91-.25 1.4 0 2.21 1.79 4 4 4 .49 0 .96-.08 1.4-.24.65 1.27 2.02 2.14 3.6 2.14 1.58 0 2.95-.87 3.6-2.14.44.16.91.24 1.4.24 2.21 0 4-1.79 4-4 0-.49-.08-.96-.24-1.4 1.27-.65 2.14-2.02 2.14-3.6z"/>
          <path d="M10.2 16.2l-3.5-3.5 1.4-1.4 2.1 2.1 5.9-5.9 1.4 1.4-7.3 7.3z" fill="#000000"/>
        </svg>
      `;
    }

    // جلب بيانات البنكين الحقيقيين فقط
    async function fetchRealBanks() {
      try {
        const resp = await fetch(
          `${SUPABASE_URL}/rest/v1/banks?status=eq.active&select=*`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!resp.ok) throw new Error('فشل جلب قائمة البنوك');
        const rows = await resp.json();

        // تصفية صارمة للبنوك الحقيقية التي أدخلتها بنفسك فقط
        const validRows = rows.filter(b => b.status === 'active' || b.is_published !== false);

        // جلب التقييمات الحقيقية
        const revResp = await fetch(
          `${SUPABASE_URL}/rest/v1/reviews?entity_type=eq.bank&select=entity_id,stars`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          }
        );
        const reviews = revResp.ok ? await revResp.json() : [];

        const reviewsMap = {};
        reviews.forEach(r => {
          if (!reviewsMap[r.entity_id]) reviewsMap[r.entity_id] = { totalStars: 0, count: 0 };
          reviewsMap[r.entity_id].totalStars += parseInt(r.stars) || 5;
          reviewsMap[r.entity_id].count += 1;
        });

        // طلبات التوثيق المعلقة
        const claimsResp = await fetch(
          `${SUPABASE_URL}/rest/v1/verification_requests?entity_type=eq.bank&status=eq.PENDING&select=entity_id`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          }
        );
        if (claimsResp.ok) {
          const claims = await claimsResp.json();
          pendingClaimsSet = new Set(claims.map(c => c.entity_id));
        }

        banksList = validRows.map(b => {
          const r = reviewsMap[b.id];
          const hasReviews = r && r.count > 0;
          const avg = hasReviews ? (r.totalStars / r.count).toFixed(1) : null;
          const count = hasReviews ? r.count : 0;

          return {
            id: b.id,
            name: b.name,
            slug: b.slug,
            city: b.city || b.address || '',
            description: b.description || b.short_description || '',
            verified: b.verified === true || b.is_verified === true,
            logo_url: b.logo_url || null,
            cover_url: b.cover_url || b.cover || b.banner_url || b.image_url || null,
            badgeColor: b.badge_type === 'blue' ? '#1D9BF0' : '#EAB308',
            ratingAvg: avg,
            ratingCount: count
          };
        });

        renderCards();
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

            function renderCards() {
      const container = document.getElementById('banks-grid');
      let filtered = banksList.filter(b => {
        const matchesSearch = b.name.toLowerCase().includes(searchKeyword.toLowerCase()) ||
                              b.city.toLowerCase().includes(searchKeyword.toLowerCase());
        let matchesCity = true;
        if (selectedCity !== 'all') {
          matchesCity = b.city.includes(selectedCity);
        }
        let matchesVerified = true;
        if (onlyVerified) {
          matchesVerified = b.verified === true;
        }
        return matchesSearch && matchesCity && matchesVerified;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-[#0B0F17] border border-zinc-800 rounded-2xl p-6 col-span-full">
            <h3 class="text-sm font-bold text-white">لا توجد بنوك مطابقة للبحث</h3>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(bank => {
        // 1. الغلاف المصغر الديناميكي (يطابق صفحة البنك 100%)
        let coverHtml = '';
        if (bank.cover_url) {
          coverHtml = `
            <div class="relative w-full h-36 select-none overflow-hidden bg-zinc-950">
              <img src="${bank.cover_url}" alt="${bank.name}" class="w-full h-full object-cover" />
              <div class="absolute inset-0 bg-gradient-to-t from-[#0B0F17] via-black/25 to-transparent"></div>
            </div>
          `;
        } else {
          coverHtml = `
            <div class="relative w-full h-36 bg-gradient-to-r from-[#0D2137] via-[#102A45] to-[#0A192B] flex items-center justify-between px-5 select-none overflow-hidden">
              <div class="opacity-15"><i class="fa-solid fa-building-columns text-white text-5xl"></i></div>
              <div class="text-right">
                <h3 class="text-white text-base font-black tracking-wide leading-tight line-clamp-1">${bank.name}</h3>
                <p class="text-blue-200 text-[11px] font-bold mt-1">خدمات مالية ومصرفية</p>
              </div>
              <div class="w-10 h-10 flex items-center justify-center opacity-30">
                <i class="fa-solid fa-shapes text-white text-2xl"></i>
              </div>
            </div>
          `;
        }

        // 2. الشعار بنفس استايل صفحة البنك الفردية (مربع أبيض فاخر + حواف دائرية + إطار أسود نقي)
        const logoHtml = bank.logo_url ? `
          <div class="w-16 h-16 rounded-2xl bg-white p-1.5 shadow-2xl border-2 border-black flex items-center justify-center overflow-hidden shrink-0">
            <img src="${bank.logo_url}" alt="${bank.name}" class="w-full h-full object-contain" />
          </div>
        ` : `
          <div class="w-16 h-16 rounded-2xl bg-white p-2 shadow-2xl border-2 border-black flex items-center justify-center overflow-hidden shrink-0">
            <i class="fa-solid fa-building-columns text-zinc-800 text-2xl"></i>
          </div>
        `;

        // 3. زر إثبات الملكية الأحمر الرسمي (مطابق تماماً للصورة رقم 2)
        let claimBtnHtml = '';
        if (typeof pendingClaimsSet !== 'undefined' && pendingClaimsSet && pendingClaimsSet.has(bank.id)) {
          claimBtnHtml = `
            <div class="inline-flex items-center gap-1.5 bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold px-3 py-1.5 rounded-full shadow">
              <i class="fa-solid fa-clock text-xs"></i>
              <span>قيد المراجعة</span>
            </div>
          `;
        } else {
          claimBtnHtml = `
            <button
              type="button"
              onclick="event.stopPropagation(); openClaimModal('${bank.id}', '${bank.name}')"
              class="inline-flex items-center gap-1.5 bg-[#EF4444] hover:bg-red-700 text-white text-xs font-bold px-3.5 py-1.5 rounded-full shadow-lg transition active:scale-95 cursor-pointer"
            >
              <i class="fa-solid fa-shield-halved text-xs"></i>
              <span>إثبات الملكية</span>
            </button>
          `;
        }

        // 4. سطر التقييم مطابقة لأسلوب صفحة البنك
        let ratingHtml = '';
        if (bank.ratingAvg && bank.ratingCount > 0) {
          ratingHtml = `
            <div class="flex items-center justify-start gap-1.5 text-xs font-bold pt-0.5">
              <span class="text-zinc-400 font-normal">★ التقييمات</span>
              <span class="text-brand-gold font-black font-mono">${bank.ratingAvg}</span>
              <span class="text-zinc-400 text-[11px] font-normal">(${bank.ratingCount} تقييم)</span>
            </div>
          `;
        } else {
          ratingHtml = `<div class="text-right pt-0.5"><span class="text-zinc-500 text-xs">لا توجد تقييمات بعد</span></div>`;
        }

        return `
          <article
            onclick="window.location.href='/bank?slug=' + (bank.slug || bank.id)"
            class="bg-[#0B0F17] border border-zinc-800/90 rounded-2xl overflow-hidden shadow-2xl flex flex-col justify-between transition hover:border-zinc-700 cursor-pointer group"
          >
            <div>
              ${coverHtml}

              <div class="px-4 relative flex items-end justify-between -mt-8 mb-2">
                <div class="relative z-10 order-1">
                  ${logoHtml}
                </div>
                <div class="order-2 mb-1">
                  ${claimBtnHtml}
                </div>
              </div>

              <div class="px-4 pt-1 pb-3 text-right space-y-1.5">
                <div class="flex items-center justify-start gap-1.5 flex-wrap">
                  <h2 class="text-base font-black text-white leading-tight group-hover:text-brand-gold transition">
                    ${bank.name}
                  </h2>
                  ${bank.verified ? renderVerifiedRosette(bank.badgeColor) : ''}
                </div>

                ${ratingHtml}

                ${bank.description ? `
                  <p class="text-xs text-zinc-300 leading-relaxed pt-1 line-clamp-2">
                    ${bank.description}
                  </p>
                ` : ''}

                ${bank.city ? `
                  <div class="flex items-center justify-start gap-1 text-xs text-zinc-400 pt-1">
                    <i class="fa-solid fa-location-dot text-brand-gold text-[11px]"></i>
                    <span>${bank.city}</span>
                  </div>
                ` : ''}
              </div>
            </div>

            <div class="p-4 pt-1">
              <button
                type="button"
                onclick="event.stopPropagation(); window.location.href='/bank?slug=' + (bank.slug || bank.id)"
                class="w-full py-2.5 rounded-xl bg-brand-gold hover:bg-brand-goldHover text-black font-black text-sm flex items-center justify-center gap-2 shadow transition active:scale-98 cursor-pointer"
              >
                <span>عرض صفحة البنك</span>
                <i class="fa-solid fa-arrow-left text-xs"></i>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    function handleSearch() {
      searchKeyword = document.getElementById('search-input').value.trim();
      renderCards();
    }

    function setCityFilter(city, btn) {
      selectedCity = city;
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('filter-chip-active'));
      if (btn) btn.classList.add('filter-chip-active');
      renderCards();
    }

    function toggleVerifiedOnly(btn) {
      onlyVerified = !onlyVerified;
      if (onlyVerified) {
        btn.classList.add('filter-chip-active');
      } else {
        btn.classList.remove('filter-chip-active');
      }
      renderCards();
    }

    function openClaimModal(bankId, bankName) {
      document.getElementById('claim-bank-id').value = bankId;
      document.getElementById('claim-bank-title').innerText = `طلب إثبات ملكية: ${bankName}`;
      document.getElementById('claim-modal').classList.remove('hidden');
    }

    function closeClaimModal() {
      document.getElementById('claim-modal').classList.add('hidden');
    }

    async function submitClaimRequest(e) {
      e.preventDefault();
      const entityId = document.getElementById('claim-bank-id').value;
      const name = document.getElementById('claim-name').value.trim();
      const role = document.getElementById('claim-role').value.trim();
      const phone = document.getElementById('claim-phone').value.trim();
      const notes = document.getElementById('claim-notes').value.trim();
      const btn = document.getElementById('claim-submit-btn');

      btn.disabled = true;
      btn.innerText = 'جاري الإرسال...';

      try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/verification_requests`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            entity_type: 'bank',
            entity_id: entityId,
            applicant_name: name,
            applicant_role: role,
            phone: phone,
            notes: notes,
            status: 'PENDING'
          })
        });

        if (!resp.ok) throw new Error('فشل حفظ الطلب');

        alert('تم إرسال طلب إثبات الملكية بنجاح!');
        closeClaimModal();
        document.getElementById('claim-form').reset();
        fetchRealBanks();
      } catch (err) {
        alert('حدث خطأ أثناء الإرسال');
      } finally {
        btn.disabled = false;
        btn.innerText = 'إرسال الطلب';
      }
    }

    window.addEventListener('DOMContentLoaded', fetchRealBanks);
  </script>

</body>
</html>
