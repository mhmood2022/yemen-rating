<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البنوك | يمن ريتغ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/yemen-rating.css">
</head>
<body>

    <!-- الهيدر -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="brand">
                <div class="brand-mark"><i class="fas fa-star"></i></div>
                <div class="brand-text">
                    <strong>YEMEN RATING</strong>
                    <span>يمن ريتغ | منصة الأعمال</span>
                </div>
            </a>
            <nav class="desktop-nav">
                <ul>
                    <li><a href="companies.html" class="nav-link"><i class="fas fa-building"></i> الشركات</a></li>
                    <li><a href="jobs.html" class="nav-link"><i class="fas fa-briefcase"></i> الوظائف</a></li>
                    <li><a href="banks.html" class="nav-link active"><i class="fas fa-landmark"></i> البنوك</a></li>
                    <li><a href="verification.html" class="nav-link gold-link"><i class="fas fa-circle-check"></i> التوثيق</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
                <div id="headerActions"></div>
                <button type="button" class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </header>

    <!-- المحتوى -->
    <main class="section section-dark" style="min-height:80vh;">
        <div class="container">
            <div class="section-head">
                <div class="section-icon gold"><i class="fas fa-landmark"></i></div>
                <div class="section-titles">
                    <h2>🏦 البنوك والمؤسسات المالية</h2>
                    <p id="banksCount">بنوك معتمدة ومحافظ إلكترونية</p>
                </div>
            </div>

            <!-- الفلاتر -->
            <div class="filter-bar">
                <input type="text" class="form-control" id="searchInput" placeholder="🔍 ابحث عن بنك...">
                <select class="form-control" id="cityFilter">
                    <option value="all">كل المدن</option>
                </select>
            </div>

            <!-- شبكة البنوك -->
            <div class="banks-showcase" id="banksGrid"></div>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 YEMEN RATING يمن ريتغ - جميع الحقوق محفوظة</p>
                <a href="admin.html" class="footer-admin">لوحة الإدارة</a>
            </div>
        </div>
    </footer>

    <!-- القائمة الجانبية -->
    <nav id="mainNav">
        <button type="button" class="nav-close-btn" onclick="YRB.closeNav()"><i class="fas fa-times"></i></button>
        <ul>
            <li><a href="companies.html"><i class="fas fa-building"></i> الشركات</a></li>
            <li><a href="jobs.html"><i class="fas fa-briefcase"></i> الوظائف</a></li>
            <li><a href="banks.html" class="active"><i class="fas fa-landmark"></i> البنوك</a></li>
            <li><a href="verification.html"><i class="fas fa-circle-check" style="color:#fbbf24;"></i> التوثيق</a></li>
        </ul>
    </nav>

    <div class="overlay" id="overlay"></div>
    <div id="modalRoot"></div>
    <div class="profile-page hidden" id="profilePage">
        <div class="container" id="profileContent"></div>
    </div>

    <script src="js/db.js"></script>
    <script>
        const YRB = {
            currentRating: 5,

            init() {
                YR_DB.init().then(() => {
                    this.applyTheme();
                    this.bindThemeToggle();
                    this.bindNav();
                    this.loadCityFilter();
                    this.bindFilters();
                    this.renderBanks();
                    this.renderHeaderActions();
                });
            },

            applyTheme() {
                const theme = localStorage.getItem('yr_theme') || 'dark';
                if (theme === 'light') document.body.classList.add('light-mode');
                this.updateThemeIcon();
            },

            updateThemeIcon() {
                const btn = document.getElementById('themeToggle');
                if (!btn) return;
                btn.innerHTML = document.body.classList.contains('light-mode')
                    ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            },

            bindThemeToggle() {
                const btn = document.getElementById('themeToggle');
                if (!btn) return;
                btn.addEventListener('click', () => {
                    document.body.classList.toggle('light-mode');
                    localStorage.setItem('yr_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
                    this.updateThemeIcon();
                });
            },

            closeNav() {
                document.getElementById('mainNav').classList.remove('open');
                document.getElementById('overlay').classList.remove('active');
            },

            bindNav() {
                const toggle = document.getElementById('navToggle');
                const overlay = document.getElementById('overlay');
                if (toggle) toggle.addEventListener('click', () => {
                    document.getElementById('mainNav').classList.add('open');
                    overlay.classList.add('active');
                });
                if (overlay) overlay.addEventListener('click', () => this.closeNav());
            },

            loadCityFilter() {
                const citySelect = document.getElementById('cityFilter');
                YR_DB.get('cities').forEach(city => {
                    citySelect.innerHTML += '<option value="' + city.id + '">' + this.esc(city.name) + '</option>';
                });
            },

            bindFilters() {
                document.getElementById('searchInput').addEventListener('input', () => this.renderBanks());
                document.getElementById('cityFilter').addEventListener('change', () => this.renderBanks());
            },

            renderBanks() {
                const grid = document.getElementById('banksGrid');
                const search = (document.getElementById('searchInput').value || '').toLowerCase();
                const city = document.getElementById('cityFilter').value;

                let banks = YR_DB.get('banks');

                if (search) {
                    banks = banks.filter(b =>
                        b.name.toLowerCase().includes(search) ||
                        (b.description || '').toLowerCase().includes(search)
                    );
                }
                if (city !== 'all') banks = banks.filter(b => b.city === city);

                document.getElementById('banksCount').textContent =
                    'تم العثور على ' + banks.length + ' بنك ومؤسسة مالية';

                if (banks.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><i class="fas fa-landmark"></i><p>لا توجد بنوك مطابقة</p></div>';
                    return;
                }

                grid.innerHTML = banks.map(bank => {
                    const rating = YR_DB.calcRating(bank.id, 'bank');
                    return '<div class="bank-card" onclick="YRB.openBank(\'' + bank.id + '\')">' +
                        '<div class="bank-logo"><i class="fas fa-landmark"></i></div>' +
                        '<div class="bank-info">' +
                        '<h3>' + this.esc(bank.name) + '</h3>' +
                        '<p>' +
                        (bank.verified ? '<span style="color:var(--success);">✓ موثق</span>' : '') + ' ' +
                        (rating.count > 0 ? '<span style="color:var(--gold-400);">⭐ ' + rating.avg + '/5</span>' : '') +
                        '</p>' +
                        '<p style="font-size:0.85rem;margin-top:6px;">' + this.esc((bank.description || '').substring(0, 80)) + '</p>' +
                        '</div></div>';
                }).join('');
            },

            openBank(bankId) {
                const bank = YR_DB.findById('banks', bankId);
                if (!bank) return;
                const rating = YR_DB.calcRating(bankId, 'bank');
                const reviews = YR_DB.where('reviews', 'entityId', bankId);
                const content = document.getElementById('profileContent');
                const self = this;

                let reviewsHtml = reviews.length > 0 ? reviews.map(r =>
                    '<div style="padding:14px 0;border-bottom:1px solid var(--border);">' +
                    '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">' +
                    '<strong>' + this.esc(r.userName) + '</strong>' +
                    '<span class="rating-stars">' + this.starsHtml(r.stars) + '</span>' +
                    '</div>' +
                    '<p style="color:var(--text-muted);">' + this.esc(r.comment || '') + '</p>' +
                    '</div>'
                ).join('') : '<p style="color:var(--text-muted);">لا توجد تقييمات بعد</p>';

                content.innerHTML =
                    '<button class="btn btn-navy profile-close" onclick="YRB.closeProfile()"><i class="fas fa-arrow-right"></i> رجوع</button>' +
                    '<div class="profile-hero">' +
                    '<div class="profile-logo"><i class="fas fa-landmark"></i></div>' +
                    '<div class="profile-info">' +
                    '<h1>' + this.esc(bank.name) + ' ' +
                    (bank.verified ? '<span class="badge badge-verified"><i class="fas fa-circle-check"></i> موثق</span>' : '') +
                    '</h1>' +
                    (rating.count > 0 ?
                        '<div class="rating-box">' +
                        '<span class="rating-stars">' + this.starsHtml(rating.avg) + '</span>' +
                        '<span class="rating-score" style="color:var(--gold-400);">' + rating.avg + '/5</span>' +
                        '<span class="rating-count">(' + rating.count + ' تقييم)</span>' +
                        '</div>' : '') +
                    '<p class="profile-desc">' + this.esc(bank.description || '') + '</p>' +
                    '</div></div>' +
                    '<div class="profile-grid"><div>' +
                    '<div class="profile-box"><h2><i class="fas fa-concierge-bell"></i> الخدمات</h2>' +
                    '<p style="color:var(--text-muted);line-height:2;">' + this.esc(bank.services || 'لا توجد خدمات') + '</p></div>' +
                    (bank.branches ?
                        '<div class="profile-box"><h2><i class="fas fa-code-branch"></i> الفروع</h2>' +
                        '<p style="color:var(--text-muted);line-height:2;">' + this.esc(bank.branches) + '</p></div>' : '') +
                    '<div class="profile-box"><h2><i class="fas fa-star"></i> التقييمات (' + reviews.length + ')</h2>' +
                    reviewsHtml +
                    '<form id="reviewForm" style="margin-top:20px;padding-top:20px;border-top:2px solid var(--border);">' +
                    '<div class="form-group"><label>تقييمك</label>' +
                    '<div class="rating-stars-input">' +
                    [1,2,3,4,5].map(i => '<span class="rating-star" onclick="YRB.setRating(' + i + ')">★</span>').join('') +
                    '</div></div>' +
                    '<div class="form-group"><label>تعليقك</label>' +
                    '<textarea class="form-control" name="comment" required></textarea></div>' +
                    '<button type="submit" class="btn btn-gold btn-sm">إرسال التقييم</button>' +
                    '</form></div>' +
                    '</div><div>' +
                    '<div class="profile-box"><h2><i class="fas fa-address-card"></i> التواصل</h2>' +
                    '<ul class="info-list">' +
                    (bank.city ? '<li><i class="fas fa-location-dot"></i><span>' + this.esc(this.getCityName(bank.city)) + '</span></li>' : '') +
                    (bank.phone ? '<li><i class="fas fa-phone"></i><span>' + this.esc(bank.phone) + '</span></li>' : '') +
                    (bank.email ? '<li><i class="fas fa-envelope"></i><span>' + this.esc(bank.email) + '</span></li>' : '') +
                    '</ul>' +
                    '<div class="contact-actions" style="margin-top:20px;">' +
                    (bank.phone ? '<a href="tel:' + bank.phone + '" class="btn btn-navy btn-block"><i class="fas fa-phone"></i> اتصال</a>' : '') +
                    (bank.whatsapp ? '<a href="https://wa.me/' + bank.whatsapp.replace(/[^0-9]/g, '') + '" target="_blank" class="btn btn-block whatsapp-btn"><i class="fab fa-whatsapp"></i> واتساب</a>' : '') +
                    '</div></div></div></div>';

                document.getElementById('profilePage').classList.remove('hidden');
                document.body.style.overflow = 'hidden';

                const form = document.getElementById('reviewForm');
                if (form) {
                    form.addEventListener('submit', function(e) {
                        e.preventDefault();
                        const session = YR_DB.getSession();
                        if (!session) { self.showToast('سجل دخولك أولاً', 'error'); return; }
                        YR_DB.add('reviews', {
                            entityId: bankId, entityType: 'bank',
                            userId: session.userId, userName: session.name,
                            stars: self.currentRating || 5,
                            comment: e.target.comment.value
                        }).then(() => {
                            self.showToast('⭐ شكراً لتقييمك!', 'success');
                            self.openBank(bankId);
                        });
                    });
                }
            },

            setRating(value) {
                this.currentRating = value;
                document.querySelectorAll('.rating-star').forEach((star, i) => {
                    star.classList.toggle('active', i < value);
                });
            },

            closeProfile() {
                document.getElementById('profilePage').classList.add('hidden');
                document.body.style.overflow = '';
            },

            renderHeaderActions() {
                const session = YR_DB.getSession();
                const c = document.getElementById('headerActions');
                if (!c) return;
                if (session) {
                    c.innerHTML =
                        '<span style="color:var(--gold-400);font-weight:700;"><i class="fas fa-user-circle"></i> ' + this.esc(session.name) + '</span>' +
                        (session.role === 'admin' ? '<a href="admin.html" class="btn btn-gold btn-sm">الإدارة</a>' : '') +
                        '<button class="btn btn-outline btn-sm" onclick="YRB.logout()">خروج</button>';
                } else {
                    c.innerHTML = '<a href="index.html" class="btn btn-outline btn-sm">دخول</a>';
                }
            },

            logout() {
                YR_DB.clearSession();
                this.renderHeaderActions();
                this.showToast('تم الخروج', 'success');
            },

            getCityName(cityId) {
                const city = YR_DB.findById('cities', cityId);
                return city ? city.name : cityId;
            },

            starsHtml(rating) {
                let html = '';
                for (let i = 1; i <= 5; i++) {
                    html += (i <= Math.floor(rating)) ? '★' : ((i - 0.5 <= rating) ? '⯨' : '☆');
                }
                return html;
            },

            esc(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            showToast(msg, type) {
                type = type || 'info';
                let container = document.querySelector('.toast-container');
                if (!container) {
                    container = document.createElement('div');
                    container.className = 'toast-container';
                    document.body.appendChild(container);
                }
                const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '" style="color:var(--gold-400);"></i><span>' + msg + '</span>';
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => YRB.init());
    </script>
</body>
</html>
