<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>البنوك والمصارف | يمن ريتنغ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5C400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/js/all.min.js" defer></script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/yemen-rating.css">
<style>
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.site-header{background:var(--navy-900);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1000;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand-mark{width:38px;height:38px;background:var(--gold-gradient);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--navy-950);font-size:1.1rem;font-weight:900}
.page-hero{background:radial-gradient(circle at center top,var(--navy-800),var(--navy-950));padding:35px 0 25px;text-align:center;border-bottom:1px solid var(--border)}
.page-hero h1{color:var(--gold-400);font-size:clamp(1.3rem,3vw,1.8rem);font-weight:800;margin:0 0 6px 0}
.banks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:24px 0 30px}
.bank-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:var(--transition);text-decoration:none;color:inherit}
.bank-card:hover{border-color:var(--gold-400);transform:translateY(-3px)}
.bank-logo{width:50px;height:50px;border-radius:10px;background:var(--navy-700);display:flex;align-items:center;justify-content:center;color:var(--gold-400);font-size:1.3rem}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:0.85rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;width:100%}
.btn-gold{background:var(--gold-gradient);color:var(--navy-950)}
.ad-slot{background:var(--navy-900);border:1px dashed var(--border);border-radius:8px;margin:20px auto;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.8rem;min-height:80px;width:100%}
</style>
</head>
<body>
<header class="site-header">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
        <a href="index.html" class="brand"><div class="brand-mark"><i class="fa-solid fa-star"></i></div><strong>YEMEN RATING</strong></a>
        <a href="index.html" class="btn btn-gold" style="width:auto;min-height:36px;padding:0 12px;font-size:0.8rem;"><i class="fa-solid fa-house"></i> الرئيسية</a>
    </div>
</header>
<section class="page-hero">
    <div class="container">
        <h1><i class="fa-solid fa-landmark"></i> البنوك والمؤسسات المالية</h1>
        <p>دليل شامل لكافة البنوك وخدمات الصرافة والتمويل في اليمن</p>
    </div>
</section>
<div class="container">
    <div class="ad-slot" data-placement="BANKS_TOP">📢 مساحة إعلانية - أعلى صفحة البنوك</div>
    <div class="banks-grid" id="banksGrid"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/db.js"></script>
<script src="js/sb-sync.js"></script>
<script src="js/ads-loader.js"></script>
<script>
const DEMO_BANKS=[
{id:'bank1',name:'البنك اليمني للإنشاء والتعمير',city:'صنعاء',verified:true,phone:'+9671234567',desc:'بنك رائد في الخدمات المصرفية الشاملة.'},
{id:'bank2',name:'بنك الكريمي للتمويل الأصغر',city:'صنعاء',verified:true,phone:'+9671345678',desc:'خدمات التمويل الأصغر والمصرفية الإلكترونية.'},
{id:'bank3',name:'بنك التضامن الإسلامي',city:'صنعاء',verified:true,phone:'+9671567890',desc:'خدمات مصرفية متكاملة وفق الشريعة الإسلامية.'}
];
function renderBanks(){
    const list=(window.YR_DB&&YR_DB.get('banks'))||DEMO_BANKS;
    document.getElementById('banksGrid').innerHTML=list.map(b=>`
    <div class="bank-card">
        <div style="display:flex;align-items:center;gap:12px;">
            <div class="bank-logo"><i class="fa-solid fa-landmark"></i></div>
            <div>
                <strong style="font-size:1rem;color:#fff;">${b.name}</strong>
                <div style="font-size:0.78rem;color:var(--text-muted);"><i class="fa-solid fa-phone" style="color:var(--gold-500);"></i> ${b.phone||'خدمة العملاء'}</div>
            </div>
        </div>
        <p style="font-size:0.84rem;color:var(--text-muted);margin:0;line-height:1.4;">${b.description||b.desc||'خدمات مصرفية معتمدة وموثوقة.'}</p>
        <a href="bank.html?id=${b.id}" class="btn btn-gold"><i class="fa-solid fa-eye"></i> عرض التفاصيل والخدمات</a>
    </div>`).join('');
}
document.addEventListener('DOMContentLoaded',renderBanks);
</script>
</body>
</html>
