<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark" style="direction: rtl;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <title>يمن ريتغ | Yemen Rating</title>

    <!-- 1. تنظيف ومسح Service Worker والكاش القديم المخزن في ذاكرة الهاتف -->
    <script>
      (function() {
        // حذف أي Service Worker قديم مخزن في المتصفح
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        // مسح مخزن Caches القديم من ذاكرة الهاتف
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          });
        }
        // تطبيق الوضع الليلي الافتراضي الفوري
        try {
          var stored = localStorage.getItem('yr-theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F7F8FA] dark:bg-[#000000] text-[#0F172A] dark:text-white" style="direction: rtl;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?v=4.0"></script>
  </body>
</html>
