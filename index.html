<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#180505;color:#f87171;padding:20px;z-index:999999;font-family:sans-serif;direction:rtl;text-align:right;overflow:auto;';
        box.innerHTML = '<h2 style="color:#ef4444;font-size:18px;font-weight:bold;">⚠️ تنبيه خطأ برمجي:</h2><div style="background:#2b0c0c;padding:12px;border-radius:10px;margin-top:10px;color:#fff;font-size:13px;word-break:break-all;">' + msg + '</div><pre style="margin-top:15px;color:#a1a1aa;font-size:11px;direction:ltr;text-align:left;white-space:pre-wrap;">' + (error && error.stack ? error.stack : (url + ':' + line)) + '</pre>';
        document.body.appendChild(box);
      };
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>يمن ريتنج - الدليل الوطني للخدمات والتقييمات</title>
    <!-- Font Awesome Icons CDNs -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-[#0D0D0D] text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
